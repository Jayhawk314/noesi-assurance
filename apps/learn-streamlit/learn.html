ezes a manifest (procedure, engine version, a fingerprint of every input table, policies). A run is reviewed by the reviewer and approved by the partner, three different chairs."],where:["Workbench → Sources & Mappings","Workbench → Runs & Findings","Studio → Next step 'Run', 'Review', 'Approve'"],doesNot:["It does **no sampling**: no sample-size calculator, random selection, or attribute-test workpaper.","It does not inspect documents or judge authenticity. It compares records.","It reads CSV and Excel (.xlsx) files, and has ready-made readings for four standard QuickBooks Online reports (Lesson 6). Other formats, such as PDF statements, are kept as evidence but not tested."],tryIt:"In Studio, follow the Next step card through Run, Review and Approve, switching chairs when it asks."},video:{file:"learn-5-twenty-five-clean-payments.mp4",poster:"learn-5-twenty-five-clean-payments.jpg",title:"Twenty-five clean payments",minutes:2,credits:"Narration: ElevenLabs voice “Guy”. Screens: Noesi Workbench and Learn on the Harborline demo."}},{n:6,slug:"accounts-payable",title:"Accounts payable and the search for unrecorded liabilities",phase:"Fieldwork",question:"Is every liability at year end recorded — and only real ones?",minutes:40,objectives:["Get payables records out of the client's accounting system and check they are complete","Tie the AP subledger to the general ledger","Perform a search for unrecorded liabilities","Test cutoff around year end","Turn exceptions into dispositions without overstating them"],sections:[{heading:"Getting the records from the client's books",blocks:[{p:"The client's records live in its accounting system, often **QuickBooks** at a small company or an **ERP** at a larger one. The auditor asks for **reports**, not a summary: the list of open bills, the payments, the vendor list, the general ledger. Ideally you watch them being run, or run them yourself with read-only access."},{p:"A report the client produces is **information produced by the entity**. Before relying on it, test that it is complete and accurate (AU-C 500): does it foot, does it cover the whole period, does it agree to the ledger? A clean-looking export can still leave things out."},{terms:[["Unpaid Bills","QuickBooks' list of open bills by vendor. This is the **AP subledger**."],["General Ledger","Every account's activity and balance. Its **Accounts Payable** balance is the **control account** the subledger must equal."],["Bill Payment List","The payments made against bills: the population for payment tests and the search for unrecorded liabilities."],["Vendor Contact List","The vendor master: names, addresses and tax IDs, where look-alike vendors show up."]]},{p:"Export each report to Excel and keep the file exactly as exported. Then **foot it**: recompute the totals yourself before you trust them. That is the first thing to do in a spreadsheet, and the first thing Noesi does too."},{harborline:"Harborline moved from QuickBooks to a mid-market ERP in March 2024, so its records reached you as ERP exports in CSV. The steps are the same: the subledger, the ledger, the payments and the vendors, each checked for completeness before any test."}]},{heading:"Start with the tie-out",blocks:[{p:"Before testing detail, prove the detail supports the balance: the **AP subledger** (the list of open invoices by vendor) should equal the **GL control account**. A difference means the detail you are about to test is not the balance on the statements."},{harborline:"Harborline's AP subledger totals **$2,731,569.42**; GL control account 2000 shows **$2,750,019.42** — a **$18,450.00** difference. It is below clearly trivial ($21,000). Is a year-end control-account difference *qualitatively* trivial? That is your judgment to argue and document."}]},{heading:"The search for unrecorded liabilities",blocks:[{p:"Because payables are usually **understated**, testing the recorded balance is not enough — you look for liabilities that **should** be there but are not. The classic procedure:"},{steps:["Take **cash disbursements after year end** (typically through fieldwork) above a threshold.","For each, find the invoice and receiving evidence and ask: **when was the liability incurred?**","If the goods or services were received **on or before year end**, the liability belonged in the year-end balance. Check that it was recorded.","Also review unmatched receiving reports, unprocessed invoices, and vendor statements."]},{harborline:"Harborline's payment **PAY-2026-0055** is dated **8 January 2027** — after year end — and cleared the bank on 12 January. It pays voucher **VCH-2026-9336**, which is **not in the voucher population at all**. Its $32,208.42 exceeds clearly trivial. A January payment for a voucher that the year-end records do not contain is exactly what this search exists to catch."}]},{heading:"Cutoff",blocks:[{p:"Transactions near year end must land in the right period. Examine receiving reports and invoices dated in the last days before and first days after year end, and check each against the period it was recorded in. A December receipt booked in January **understates** year-end liabilities."}]},{heading:"From exception to conclusion",blocks:[{p:"Each exception needs a documented judgment. The chain is always the same:"},{steps:["**What did the test observe?** (A payment citing a voucher that does not exist.)","**What could explain it?** (Export gap, keying error, duplicate, fabrication.)","**What did the investigation conclude?**","Only then: **is there a misstatement, and how much?**"]},{p:"Watch for one defect surfacing in two tests. A voucher citing a nonexistent PO fails both the PO-reference test and the three-way match. Put it on the summary of differences once."},{harborline:"In Harborline, three vouchers with phantom POs appear in both tests. Counting both would double up about $27,000 of exposure."}]},{heading:"When the client sends a corrected file",blocks:[{p:"Mid-audit, clients send corrected extracts. The file is not the problem: the problem is the work you already did on the old one. Every run, exception and judgment that rested on the old file must be revisited, and a finding that **disappears** after a 'correction' is not automatically resolved. Ask what the correction was, and why it came when it did."}]}],standards:[["AU-C 330","Substantive procedures responsive to completeness and cutoff risks"],["AU-C 500","Evaluating the completeness of populations used as evidence"],["AU-C 450","Accumulating and evaluating identified misstatements"]],check:[{q:"Why does the search for unrecorded liabilities look at payments made *after* year end?",options:["Because year-end payments are not important","Because a liability incurred before year end is often paid after it — the later payment reveals a liability that may be missing from the balance","To test the bank reconciliation","To test sales cutoff"],answer:1,why:"Completeness is tested by starting outside the recorded balance and working back to it."},{q:"Goods arrived 29 December; the invoice was recorded 6 January. At 31 December AP is…",options:["correct","understated","overstated","unaffected"],answer:1,why:"The liability existed at year end (goods received) but was not recorded until January."},{q:"One phantom-PO voucher fails both the PO-reference test and the three-way match. On the SAD it appears…",options:["twice — once per test","once, with the other finding cleared by reference","not at all","as two halves"],answer:1,why:"One root cause, one misstatement. Cross-reference the second finding to avoid double-counting."}],task:{title:"Search for unrecorded liabilities",intro:"Use payments.csv, vouchers.csv and ap_control_balance.csv.",steps:["List every payment dated after 31 December 2026 and every payment whose voucher is missing from vouchers.csv.","For each, state whether a year-end liability may be missing and what evidence you would request.","Reconcile the subledger to the GL, and write both sides of the argument on whether $18,450 is qualitatively trivial."],deliver:"A search-for-unrecorded-liabilities workpaper and a tie-out."},noesi:{coverage:"full",summary:"Accounts payable is Noesi's home ground: eleven procedures, recorded judgments, and a trail of what changed when the client's files changed.",does:["It runs the AP procedures: **payment→voucher** and **voucher→PO references**, **document chain**, **three-way match**, **segregation of duties**, **vendor twins**, **split payments**, **subledger–GL tie**, **bank clearing**, **GL posting** and **closed value flows**.","Every exception needs a **disposition** with a note: cleared, unadjusted, adjusted, waived, or follow-up. Above clearly trivial, the disposition is a **proposal until a second person concurs**.","**What Changed** compares a corrected client file with the one it replaced. It names the stale runs, shows which exceptions appear, disappear or move, and flags the judgments to revisit. It changes nothing by itself.","It reads **QuickBooks Online exports** directly (Excel files): Unpaid Bills, Bill Payment List, Transaction List by Vendor and Vendor Contact List. It recomputes every subtotal and refuses a report whose layout it doesn't recognize.","From an **Unpaid Bills** export and a **General Ledger** export it builds the AP control balance: both reports footed first, then saved as a source file that goes through the same propose and approve steps as any other."],where:["Studio → Exceptions (judge in plain words)","Studio → What changed (cascade)","Workbench → Runs & Findings, What Changed","Workbench → Sources & Mappings (QuickBooks files, AP subledger-to-ledger tie)"],doesNot:["It has **no subsequent-disbursements search procedure**. PAY-2026-0055 surfaces as a reference exception, but the unrecorded-liability judgment is yours.","It does not detect duplicate invoices. Harborline's Assignment 11 exists to show that silence.","It does not check cutoff on receipts, because the receipts file has no receiving-cutoff test.","It does not connect to QuickBooks. You export the reports and upload them.","It reads only the Accounts Payable balance from a General Ledger export, not the full ledger detail. If the two reports are dated differently, it notes the mismatch but does not yet refuse the tie."],tryIt:"Load case-studies/harborline-marine/revision/vouchers_revised.csv after judging a few exceptions, then open What changed."},video:{file:"learn-6-a-bill-nobody-can-find.mp4",poster:"learn-6-a-bill-nobody-can-find.jpg",title:"A bill nobody can find",minutes:3,credits:"Narration: ElevenLabs voice “Guy”. Screens: QuickBooks Online test-drive sample company (Craig's Design and Landscaping Services), recorded live; Excel for the web; Noesi Workbench and Learn on the Harborline demo."}},{n:7,slug:"revenue-and-receivables",title:"Revenue and accounts receivable",phase:"Fieldwork",question:"Did the sales happen, and will the receivables be collected?",minutes:30,objectives:["Apply the presumed fraud risk in revenue recognition","Design receivable confirmations and alternative procedures","Test revenue cutoff","Evaluate the allowance for doubtful accounts"],sections:[{heading:"Revenue is presumed risky",blocks:[{p:"AU-C 240 presumes a risk of material misstatement due to fraud in **revenue recognition**. You may rebut the presumption only with documented reasons. The typical fraud is **overstatement**: fictitious sales, early recognition, or channel stuffing. So for revenue and receivables, **occurrence and existence** lead, with **cutoff** close behind."},{harborline:"Harborline earns revenue from vessel sales, service work and winter storage across four locations. A lender watching revenue and a current-ratio covenant supplies the pressure. **Figures in this lesson are illustrative — the case data covers payables only.**"}]},{heading:"Confirmations",blocks:[{p:"Sending **external confirmations** to customers is the strongest existence evidence for receivables. Under AU-C 330, when receivables are material and you decide **not** to confirm them, you must document why. AU-C 505 governs how confirmations are sent and controlled."},{terms:[["Positive confirmation","The customer replies whether they agree or not. Stronger evidence. Non-replies need follow-up."],["Negative confirmation","The customer replies only if they disagree. Weaker evidence, suitable only in limited, low-risk conditions."],["Control of the process","You select the accounts, mail or send them yourself, and replies come directly to you, never through the client."]]},{p:"For non-replies, perform **alternative procedures**: examine **cash received after year end** for that invoice, or shipping documents and the customer's order."}]},{heading:"Cutoff and valuation",blocks:[{list:["**Revenue cutoff**: examine shipments or service completions just before and after year end and check the period of the sale. Sales pulled into December overstate revenue and receivables.","**Valuation**: review the **aging** of receivables, subsequent collections, and management's **allowance for doubtful accounts**. An estimate needs evidence about its method, data and assumptions."]},{p:"Illustration: a $180,000 boat sale recorded 30 December, with the vessel delivered 4 January. If control passes on delivery, that revenue belongs in January. Against $420,000 materiality it is significant, and qualitatively sensitive because of the covenant."}]}],standards:[["AU-C 240","Presumed fraud risk in revenue recognition"],["AU-C 330","Documenting a decision not to confirm material receivables"],["AU-C 505","External confirmations"],["AU-C 540","Accounting estimates, e.g. the allowance for doubtful accounts"]],check:[{q:"Which assertion does an AR confirmation mainly address?",options:["Completeness","Existence","Valuation","Presentation"],answer:1,why:"A customer confirming a balance evidences that the receivable exists. It says little about collectibility."},{q:"A positive confirmation is not returned. Next step?",options:["Treat it as confirmed","Perform alternative procedures: subsequent cash receipts or shipping documents","Remove the balance","Ask the client to call the customer"],answer:1,why:"A non-reply is not evidence. Alternative procedures supply it."},{q:"Revenue recognition fraud risk under AU-C 240 is…",options:["only considered for public companies","presumed, and rebutting it requires documented reasons","never presumed","the auditor's to ignore if controls are strong"],answer:1,why:"It is a rebuttable presumption, and the documentation requirement is explicit."}],task:{title:"Design the confirmation plan",intro:"Illustrative: Harborline has 240 customer balances totalling $3.1m; the ten largest total $1.9m.",steps:["Decide which balances to confirm and whether positive or negative, and justify it.","Write the alternative procedures for a non-reply.","List three cutoff tests for vessel sales around 31 December."],deliver:"A one-page receivables plan."},noesi:{coverage:"none",summary:"Noesi does not audit revenue or receivables yet. Here is what it can and cannot hold.",does:["The **evidence vault** keeps PDFs, CSVs and Excel files unaltered with a SHA-256 fingerprint, for example confirmation replies received as PDFs.","The engagement's review, disposition and lock disciplines apply to the whole file."],where:["Workbench → Sources & Mappings (upload documents)"],doesNot:["It has **no receivables or revenue procedures**, no confirmation tracking, and no aging or allowance tools. Coverage will not invent them, and AP engines cannot be relabeled as AR tests.","Images (photos or scans saved as images) are not accepted file types."]}},{n:8,slug:"cash",title:"Cash",phase:"Fieldwork",question:"Does the cash on the balance sheet really exist, and is it cut off correctly?",minutes:25,objectives:["Audit a bank reconciliation","Explain outstanding checks and deposits in transit","Test cash cutoff with subsequent bank activity","Know what SAS 150 changes for cash confirmations"],sections:[{heading:"The bank reconciliation",blocks:[{p:"The client's reconciliation explains the difference between the **bank's balance** and the **book balance** at year end:"},{table:{head:["Bank balance","± reconciling items","= Book balance"],rows:[["per bank statement","− outstanding checks (written, not yet cleared)",""],["","+ deposits in transit (recorded, not yet credited)",""],["","± bank errors","per general ledger"]]}},{p:"You test it: agree the bank balance to **independent evidence** (a confirmation or the next statement obtained directly), agree the book balance to the GL, and **trace reconciling items** to the bank activity in the following weeks. Outstanding checks should clear soon after year end; deposits in transit should appear within a few days."}]},{heading:"Cutoff and kiting",blocks:[{p:"Checks written at year end but held back (not mailed) make liabilities look paid and cash look lower. Checks recorded in January but dated December do the opposite. **Kiting** moves money between accounts at year end so the same cash appears in both. A **bank transfer schedule** around year end exposes it."},{harborline:"Harborline's **PAY-2026-0028** ($16,830.55) is dated **31 December 2026** and cleared the bank on **2 January 2027**: a genuine outstanding check at year end. Tracing it to January clearing is the test. A check that never clears would be the question."}]},{heading:"Confirmations and SAS 150",blocks:[{p:"Cash is often confirmed directly with the bank. The AICPA's **SAS No. 150, External Confirmations** (July 2026) adds a **requirement to confirm cash and cash equivalents held by third parties** unless certain conditions exist. It is effective for audits of periods ending on or after **December 15, 2028**, with early adoption permitted. Harborline's 2026 audit predates it, but the direction is clear."}]}],standards:[["AU-C 505","External confirmations"],["SAS 150","External Confirmations: cash confirmation requirement, effective for periods ending on or after 12/15/2028"],["AU-C 330 / 500","Substantive procedures and evidence for cash"]],check:[{q:"An outstanding check at year end is…",options:["recorded by the bank but not the books","recorded in the books but not yet cleared by the bank","a deposit in transit","a bank error"],answer:1,why:"The company wrote and recorded it. The bank has not paid it yet."},{q:"The best evidence that a year-end outstanding check was real is…",options:["the controller's list","its clearing on the bank statement shortly after year end, obtained directly","the check stub","the GL entry"],answer:1,why:"Subsequent bank clearing, from a source you obtained, is independent evidence."},{q:"SAS 150 applies to audits of periods ending on or after…",options:["December 15, 2023","December 15, 2025","December 15, 2028","It is already mandatory for 2026"],answer:2,why:"SAS 150 is effective for periods ending on or after December 15, 2028, with early adoption permitted."}],task:{title:"Cash cutoff from the bank feed",intro:"Use payments.csv and bank.csv.",steps:["List every payment dated in the last ten days of 2026 and find its bank clearing date.","Classify each: cleared before year end, or an outstanding check at year end.","Find any payment that never clears in bank.csv and say what you would do."],deliver:"An outstanding-check listing with clearing dates."},noesi:{coverage:"partial",summary:"Noesi tests the payments side of cash against an independent bank feed. It is not a bank-reconciliation tool.",does:["**Bank clearing** (`cash.bank_clearing`) checks that every recorded payment appears in the bank feed at the same amount, within a **2% tolerance**.","**GL posting** (`gl.payment_posting`) checks that each payment posted to the GL at the right amount and in the right period. Period mismatches are cutoff exceptions."],where:["Studio → Overview (the 'Cleared bank' and 'Posted to GL' circles)","Workbench → Runs & Findings"],doesNot:["It does not audit the cash balance itself: no bank-reconciliation workpaper, deposits in transit, receipts side, or bank confirmation tracking.","Its 2% tolerance hides small differences. In Harborline, one 0.9% difference is correctly silent, so reconcile by hand to find it."]},video:{file:"learn-8-four-payments-the-bank-never-saw.mp4",poster:"learn-8-four-payments-the-bank-never-saw.jpg",title:"Four payments the bank never saw",minutes:2,credits:"Narration: ElevenLabs voice “Guy”. Screens: Noesi Workbench and Learn on the Harborline demo. SAS No. 150 per the AICPA and the Journal of Accountancy (July 2026)."}},{n:9,slug:"inventory",title:"Inventory",phase:"Fieldwork",question:"Is the inventory there, owned, and worth what it is carried at?",minutes:25,objectives:["Plan and attend a physical inventory count","Perform test counts in both directions","Test inventory cutoff, pricing and obsolescence"],sections:[{heading:"Attend the count",blocks:[{p:"When inventory is material, AU-C 501 requires you to **attend the physical count** unless impracticable. If you cannot, you must perform alternative procedures. If those fail, you must modify the opinion. You observe the client's count procedures and make **test counts**."},{terms:[["Floor to sheet","Count items on the floor and trace them to the count records. This tests **completeness**."],["Sheet to floor","Take items from the count records and find them on the floor. This tests **existence**."]]},{harborline:"Harborline carries vessels for sale and a parts warehouse in Norfolk. **Figures here are illustrative — the case data covers payables only.** A boat on consignment from a manufacturer sits on the lot but may not be Harborline's: **rights and obligations** matter as much as existence."}]},{heading:"Cutoff, pricing and obsolescence",blocks:[{list:["**Cutoff**: record the last receiving and shipping document numbers at the count. Goods received before the count must be in both inventory and payables. This is where inventory meets Lesson 6.","**Pricing**: test the cost of counted items against vendor invoices and the costing method.","**Valuation**: identify slow-moving or damaged items and test whether inventory is written down to the lower of cost and net realizable value."]},{watch:"Harborline's warehouse switched to scanner receiving mid-year, and the controller expects some receipts never reached the system. That affects inventory completeness and payables completeness at the same time."}]}],standards:[["AU-C 501","Specific considerations for inventory: attendance at physical counting"],["AU-C 540","Estimates: net realizable value, obsolescence reserves"]],check:[{q:"Tracing items from the floor to the count sheets tests…",options:["existence","completeness","valuation","presentation"],answer:1,why:"Starting from the physical items checks that everything present was recorded."},{q:"Inventory is material and you cannot attend the count. You must…",options:["rely on management's count","perform alternative procedures; if they are insufficient, modify the opinion","exclude inventory from the audit","issue a clean opinion with a note"],answer:1,why:"AU-C 501 requires attendance unless impracticable, then alternatives, then a modified opinion."},{q:"A consigned vessel on Harborline's lot threatens which assertion if it is counted?",options:["Cutoff","Rights and obligations","Classification","Accuracy"],answer:1,why:"It exists, but Harborline does not own it."}],task:{title:"Plan the count",intro:"Illustrative: 38 vessels on four lots; 6,200 part SKUs in Norfolk.",steps:["Write the count instructions you would review and the observations you would make.","Design test counts in both directions, with sample sizes.","Link the receiving-process change to both inventory and payables cutoff."],deliver:"A count-attendance plan."},noesi:{coverage:"none",summary:"Noesi has no inventory procedures. Count attendance is physical work that no software performs.",does:["The vault can keep count sheets and price lists as PDF, CSV or Excel files, unaltered and fingerprinted.","The **three-way match** touches inventory indirectly: it flags invoices without receipts, which is also an inventory-completeness signal."],where:["Workbench → Sources & Mappings (store documents)"],doesNot:["It has no count, test-count, cutoff, pricing or obsolescence procedures. Coverage will never report inventory as tested."]}}],lp=[{n:1,slug:"acceptance",title:"Client acceptance and the terms of the engagement",phase:"Planning",question:"Should we do this audit at all — and on what terms?",minutes:20,objectives:["Explain why a firm decides whether to accept or continue a client before any audit work","List what acceptance considers: integrity, independence, competence, and risk","Describe what the engagement letter must establish","Know what changes when a firm replaces another auditor"],sections:[{heading:"Why the audit starts with a decision, not a test",blocks:[{p:"An audit is a firm putting its name on someone else's numbers. Before any testing, the firm decides whether it **can** and **should** take that risk. A bad client — one whose management lacks integrity, or whose affairs the firm cannot competently audit — is a risk no amount of fieldwork repairs."},{p:"U.S. firms now run this decision inside a **quality management system**. SQMS No. 1 required every firm to have its system in place by December 15, 2025, and SAS No. 146 (the engagement partner's responsibilities, in AU-C 220) applies to engagements for periods beginning on or after that date. Acceptance and continuance of clients is one of the areas every firm must set quality objectives for."}]},{heading:"What acceptance and continuance weigh",blocks:[{terms:[["Integrity of management","Is there reason to believe management would mislead the auditor, override controls, or pressure the firm? Prior disputes, regulatory trouble and sudden auditor changes are signals."],["Independence and ethics","Does anyone on the team, or the firm, hold a financial interest, a family tie, or a non-audit service that impairs independence in fact or appearance?"],["Competence and capacity","Does the firm have people who know the industry and the time to staff the job before the deadline?"],["Engagement risk","Who relies on the statements (lenders, investors)? How exposed is the firm if the audit fails?"]]},{p:"For an existing client this is repeated every year as **continuance**. It is not a formality: circumstances change, and so does the risk."}]},{heading:"Changing auditors",blocks:[{p:"If another firm audited last year, the new (successor) auditor makes inquiries of the predecessor — with the client's permission — about management integrity, disagreements, and the reasons for the change. AU-C 510 then requires evidence that the **opening balances** carry no material misstatement into the current year."},{watch:"A client that refuses permission to talk to the predecessor has told you something important. Treat it as a reason to decline, not a paperwork gap."}]},{heading:"The engagement letter",blocks:[{p:"AU-C 210 requires agreement on the **terms of the engagement**, normally in an engagement letter, before work begins. It establishes the preconditions for an audit:"},{list:["the objective and scope of the audit and the financial reporting framework (for example U.S. GAAP);","**management's responsibilities** — for the financial statements, for internal control, and for giving the auditor access to all information and people;","the auditor's responsibilities and the inherent limitations of an audit (reasonable, not absolute, assurance);","the expected form of the report, and practical matters such as timing and fees."]},{p:"If management will not accept its responsibilities, the preconditions for an audit are not present and the firm should not accept."}]},{heading:"Harborline, as a continuing client",blocks:[{harborline:"This is Harborline's **third annual audit**; the prior two opinions were unmodified. Its lender raised the credit line to $6 million and requires audited statements **within 120 days** of year end plus a current ratio of at least 1.25. That covenant is the reason the audit exists — and a reason for care: a covenant is an incentive to present results favourably."},{p:"Continuance questions worth asking this year: the AP supervisor left and was not replaced for eleven weeks; approval limits were 'handled informally'. None of that makes Harborline unauditable — but it changes the risk the firm is accepting, and the plan in Lessons 2–4 must answer it."}]}],standards:[["SQMS 1 / SAS 146 (AU-C 220)","Firm quality management; the engagement partner's responsibility for quality, including acceptance and continuance"],["AU-C 210","Terms of engagement, the preconditions for an audit, and inquiries of the predecessor before accepting (amended by SAS 147)"],["AU-C 510","Opening balances in initial audits"]],check:[{q:"Management refuses to acknowledge responsibility for internal control in the engagement letter. What follows?",options:["Accept, but add more substantive testing","The preconditions for an audit are not present; the firm should not accept","Accept and disclose it in the report","Ask the lender to sign instead"],answer:1,why:"AU-C 210 makes management's acknowledgement of its responsibilities a precondition. Extra testing cannot substitute for it."},{q:"Why repeat the acceptance decision every year for a continuing client?",options:["Standards require a new engagement letter format each year","Circumstances and risk change — integrity concerns, independence, or capacity can arise after the first year","It is only required for public companies","To renegotiate the fee"],answer:1,why:"Continuance is a fresh judgment on current facts. Harborline's supervisor vacancy is exactly the kind of new fact it considers."},{q:"A successor auditor's inquiries of the predecessor require…",options:["nothing — they are automatic","the client's permission","the lender's permission","a court order"],answer:1,why:"The predecessor owes the client confidentiality; the client must authorize the communication. A refusal is itself a warning sign."}],task:{title:"Write the continuance memo",intro:"Using only the engagement brief (case-studies/harborline-marine/docs/01-engagement-brief.md):",steps:["List every fact in the brief that bears on management integrity, independence, competence or engagement risk.","For each, say whether it argues for continuing, against, or for continuing with specific responses.","Conclude in two sentences: continue or not, and what the plan must address because of it."],deliver:"A one-page continuance memo."},noesi:{coverage:"partial",summary:"Noesi records who is accountable for the engagement and enforces the separation that quality management depends on. The acceptance decision itself stays with you.",does:["**Creating an engagement** (client name and period end) makes the person who creates it its **partner**.","The partner assigns a **preparer** and a **reviewer** on the Team tab; readiness blocks the lock until both are assigned (`TEAM_ASSIGNMENTS_INCOMPLETE`).","Every action is written to a **hash-chained journal** — who did what, in which chair, and when — which is the attributable trail quality management expects."],where:["Workbench → engagement list (create)","Workbench → Team tab (partner chair)","Studio → top bar, 'Sitting as' shows your chair"],doesNot:["It has no acceptance or independence checklist and records no engagement letter. The production-readiness list names this as a gap.","On one laptop, chairs are role-play: the same person sits in each. The tool says so rather than pretending otherwise."],tryIt:"Start with --demo, open the Workbench Team tab, and see the three chairs the case assigns."},video:{file:"learn-1-should-we-sign.mp4",poster:"learn-1-should-we-sign.jpg",title:"Should we sign?",minutes:3,credits:"Narration: ElevenLabs voice “Guy”. Opening photo: “Legal Contract & Signature - Warm Tones”, Blogtrepreneur, CC BY 2.0, via Wikimedia Commons. Screens: Noesi Workbench and Learn on the Harborline demo; the engagement brief."}},{n:2,slug:"understanding-and-analytics",title:"Understanding the entity and preliminary analytics",phase:"Planning",question:"Where could these financial statements be wrong — and why?",minutes:30,objectives:["Describe the risk-assessment procedures AU-C 315 requires","Use preliminary analytical procedures to find unexpected relationships","Separate inherent risk from control risk, as SAS 145 requires","Recognize the two fraud risks presumed in every audit"],sections:[{heading:"Risk assessment comes before testing",blocks:[{p:"You cannot decide what to test until you know where misstatement could hide. AU-C 315 — rewritten by **SAS 145**, effective for periods ending on or after December 15, 2023 — requires risk-assessment procedures: **inquiry** of management and others, **analytical procedures**, and **observation and inspection**. Their output is the set of **risks of material misstatement (RMM)** at the financial-statement level and at the **assertion** level."},{p:"You build an understanding of the entity and its environment: its industry and regulation, how it makes money, its financing (Harborline's covenant), its accounting policies, and its **system of internal control**."}]},{heading:"Assertions — what exactly could be wrong",blocks:[{p:"Management's statements carry implicit claims called **assertions**. Risks and procedures are both expressed against them."},{table:{head:["Transactions (e.g. purchases)","Balances (e.g. accounts payable)"],rows:[["Occurrence — it really happened","Existence — it really exists"],["Completeness — nothing left out","Completeness — nothing left out"],["Accuracy — right amounts","Accuracy, valuation and allocation"],["Cutoff — right period","Rights and obligations"],["Classification","Classification"],["Presentation","Presentation"]]}},{p:"For a liability like accounts payable the dangerous direction is usually **understatement** — so **completeness** is the key assertion. For assets and revenue, **existence/occurrence** usually is."}]},{heading:"Preliminary analytical procedures",blocks:[{p:"Analytics compare recorded amounts with an **expectation** — prior year, budget, industry, or a relationship between accounts. At planning they are a searchlight, not evidence: they point to accounts that moved unexpectedly or failed to move when they should have."},{steps:["Form the expectation first (for example: AP should rise roughly with purchases).","Compare to the recorded figure.","Where the difference is significant, ask why — and record it as a possible risk."]},{p:"Useful ratios for a payables cycle: **days payable outstanding** (AP ÷ cost of sales × 365), AP to purchases, and the current ratio. A current ratio sitting just above a covenant floor deserves a second look."}]},{heading:"Inherent risk and control risk, separately",blocks:[{p:"SAS 145 requires you to assess **inherent risk** (how susceptible an assertion is to misstatement before controls — complexity, judgment, change, incentive) and **control risk** (whether controls would prevent or detect it) **separately**. If you do not plan to test controls, control risk is at the maximum and the RMM equals the inherent-risk assessment."},{p:"It also adds a **stand-back**: after identifying risks, look again at every material class of transactions, balance and disclosure that you did not flag, and ask whether that conclusion is still right."}]},{heading:"Fraud is presumed in two places",blocks:[{p:"AU-C 240 presumes a fraud risk in **revenue recognition** (you may overcome it only with documented reasons) and treats **management override of controls** as a risk in every audit, answered in part by testing journal entries. The team also discusses, together, how and where fraud could occur — the **brainstorming** session."},{watch:"Fraud needs pressure, opportunity and rationalization. A covenant supplies pressure; an eleven-week approval gap supplies opportunity."}]},{heading:"Harborline's facts, turned into risks",blocks:[{harborline:"Three changes this year: (1) the **AP supervisor left in June** and was not replaced until September — payments went out without a dedicated approver; (2) **vendor creation moved into purchasing** in April — the people who raise POs can now create the vendors they pay; (3) the **warehouse switched to scanners** mid-year, and the controller expects some receipts never reached the system."},{p:"Each is a risk at an assertion: (1) **authorization** of payments; (2) **occurrence** — fictitious or duplicate vendors; (3) **occurrence and accuracy** — paying for goods never received. Lesson 4 turns them into a plan."}]}],standards:[["AU-C 315 (SAS 145)","Understanding the entity; identifying and assessing RMM; separate inherent and control risk; stand-back"],["AU-C 520","Analytical procedures"],["AU-C 240","Fraud: presumed revenue risk, management override, brainstorming"]],check:[{q:"For accounts payable, which assertion is usually the highest risk?",options:["Existence","Completeness","Presentation","Rights and obligations"],answer:1,why:"Liabilities are more often understated than overstated — an unrecorded invoice makes results look better. Completeness is the usual focus."},{q:"Under SAS 145, if you will not test controls over an assertion, the RMM is…",options:["low, because substantive tests will catch everything","assessed at the inherent-risk level (control risk at maximum)","not assessed at all","equal to detection risk"],answer:1,why:"With no controls reliance, control risk is maximum, so the combined RMM equals the inherent-risk assessment."},{q:"A preliminary analytical procedure shows AP flat while purchases rose 20%. What is it?",options:["Evidence that AP is fairly stated","A misstatement to put on the SAD","A signal of possible understatement to investigate — a risk, not a conclusion","Irrelevant at planning"],answer:2,why:"At planning, analytics direct attention. Flat AP against rising purchases suggests unrecorded liabilities — a completeness risk to test."}],task:{title:"Build the risk table",intro:"Using the engagement brief and the vendors.csv and payments.csv files:",steps:["For each of Harborline's three changes, write the risk, the assertion it threatens, and whether it is inherent, control, or both.","Add the two presumed fraud risks and say how each applies (or does not) to Harborline.","Do the stand-back: name one material area you did not flag and justify leaving it unflagged."],deliver:"A risk table: risk · assertion · inherent/control · why."},noesi:{coverage:"partial",summary:"Noesi keeps the assertion-level risk register as recorded judgment. It does not do analytics or grade risks for you.",does:["The **Planning & Risk** tab records each risk with its **assertion**, a **level** (unassessed, low, moderate, high, significant), your rationale and your planned response.","A **high or significant** risk is a proposal until a second person concurs. Changing it voids the concurrence.","Readiness refuses the lock over `RISKS_UNASSESSED`, `HIGH_RISKS_WITHOUT_RESPONSE`, `HIGH_RISKS_WITHOUT_PROCEDURE` and `RISKS_AWAITING_CONCURRENCE`."],where:["Workbench → Planning & Risk (any team chair records; reviewer or partner concurs)"],doesNot:["It has no preliminary-analytics or ratio engine. You compute those in a spreadsheet.","It stores your combined risk level. It deliberately does not show separate inherent and control dials: that decomposition is your judgment, recorded in the rationale.","It does not identify fraud risks or run journal-entry tests."],tryIt:"Record 'Payments released without approval during the vacancy' at the authorization assertion, level significant, then try to concur with it from the same chair."},video:{file:"learn-2-where-could-it-be-wrong.mp4",poster:"learn-2-where-could-it-be-wrong.jpg",title:"Where could it be wrong?",minutes:2,credits:"Narration: ElevenLabs voice “Guy”. Screens: Noesi Workbench and Learn on the Harborline demo; the engagement brief."}},{n:3,slug:"materiality",title:"Materiality and audit risk",phase:"Planning",question:"How large a mistake would change a reader's decision?",minutes:25,objectives:["Set overall materiality on a defensible benchmark","Derive performance materiality and the clearly-trivial threshold","Use the audit risk model to decide how much work a risk demands","Explain qualitative materiality"],sections:[{heading:"Materiality is about the reader",blocks:[{p:"AU-C 320: misstatements are **material** if they could reasonably influence the economic decisions users make on the statements. So start with the user. Harborline's key user is its **lender**, watching revenue and a current-ratio covenant."},{p:"Materiality is set at planning, revisited as the audit proceeds, and documented with its **basis** and **rationale**."}]},{heading:"Choosing a benchmark",blocks:[{p:"Firms use rules of thumb — these are practice conventions, **not** requirements of the standard:"},{table:{head:["Benchmark","Typical range","When it fits"],rows:[["Pre-tax income","~5%","Stable, profitable entities"],["Revenue","~0.5%–1%","Thin or volatile profit; users focused on activity"],["Total assets","~1%–2%","Asset-heavy entities, some lenders' focus"],["Equity","~1%–5%","Investment-type entities"]]}},{harborline:"The plan uses **1% of revenue**: 1% × $42.4m ≈ $424,000, rounded to **$420,000** — the measure the lender's covenant tracks and the most stable across Harborline's three audited years."}]},{heading:"Two derived thresholds do the daily work",blocks:[{terms:[["Performance materiality","Set below overall (commonly 50%–75%) to leave headroom for misstatements you do not find and for aggregation. You design procedures to it. Harborline: 75% × 420,000 = **$315,000**."],["Clearly trivial","Below this, misstatements need not be accumulated — unless qualitatively significant. Commonly ~5% of overall. Harborline: **$21,000**."]]},{watch:"An unauthorized $500 payment is not 'trivial' — it is evidence about a control. Qualitative factors (fraud, covenants, related parties, a small error that flips a loss to a profit) can make a small amount material."}]},{heading:"The audit risk model",blocks:[{p:"**Audit risk** is the risk of issuing a clean opinion on materially misstated statements. It combines the **risk of material misstatement** (inherent × control — the client's condition, which you assess) with **detection risk** (that your procedures miss it — the part you control)."},{p:"The practical rule: **the higher the RMM, the lower the detection risk you can accept**, so the more persuasive and extensive your procedures must be — more independent evidence, larger samples or whole populations, work nearer year end. A **significant risk** needs a response designed specifically for it."}]}],standards:[["AU-C 320","Materiality in planning and performing an audit; performance materiality"],["AU-C 450","Clearly trivial threshold; evaluating misstatements"],["AU-C 315 / 330","Risk of material misstatement and the response to it"]],check:[{q:"Overall materiality is $420,000 and performance materiality is 75% of it. What is performance materiality?",options:["$21,000","$105,000","$315,000","$420,000"],answer:2,why:"75% × 420,000 = 315,000. It sits below overall to leave room for undetected and aggregated misstatement."},{q:"A $9,000 unauthorized payment, below clearly trivial ($21,000). Accumulate it?",options:["No — it is below clearly trivial","Yes — it is qualitatively significant (authorization failure, possible fraud)","Only if the client agrees","Only at year end"],answer:1,why:"Clearly trivial means clearly inconsequential by size *and* nature. An unauthorized payment is significant by nature."},{q:"You assess RMM as high. Detection risk must be…",options:["higher","lower — so procedures become more extensive and persuasive","unchanged","zero"],answer:1,why:"Audit risk is held acceptably low; higher RMM leaves less room, so detection risk must fall."}],task:{title:"Defend the benchmark",intro:"The plan chose 1% of revenue.",steps:["Compute materiality on 1% of total assets ($28.1m) and compare with $420,000.","Argue which benchmark better serves the lender, citing the covenant.","Name two qualitative factors at Harborline that could make an amount under $21,000 matter."],deliver:"A half-page materiality memo: benchmark, amount, derived thresholds, qualitative factors."},noesi:{coverage:"full",summary:"Materiality is entered once, and every later judgment is measured against it automatically.",does:["Set **materiality with its basis and rationale** on the Workbench SAD & Completion tab. In Studio it is the first 'Next step'.","The tool **derives performance materiality (75%) and clearly trivial (5%)**. Both appear on the SAD and the workpaper.","Clearly trivial decides which judgments need a **second person's concurrence**: dispositions above it are proposals until concurred.","Readiness refuses the lock while `MATERIALITY_NOT_SET`."],where:["Studio → Next step 'Set materiality' (partner chair)","Workbench → SAD & Completion","Studio → Overview → materiality ruler"],doesNot:["It does not choose the benchmark or the percentage. It applies fixed 75% and 5% derivations, which you should check against your firm's methodology.","It does not evaluate qualitative materiality. When you waive something, you are asserting it is not qualitatively significant."],tryIt:"Enter 420000 and check that the ruler shows $21,000 and $315,000."},video:{file:"learn-3-how-big-a-mistake.mp4",poster:"learn-3-how-big-a-mistake.jpg",title:"How big a mistake?",minutes:2,credits:"Narration: ElevenLabs voice “Guy”. Screens: Noesi Studio and Learn on the Harborline demo. Photos from Wikimedia Commons: Jernej Furman (CC BY 2.0); Jim.henderson (CC BY-SA 4.0)."}},{n:4,slug:"controls-and-plan",title:"Internal control and the audit plan",phase:"Planning",question:"Which controls can we rely on, and what will we test?",minutes:30,objectives:["Document a transaction cycle and its key controls","Decide between a controls-reliance and a substantive approach","Link each risk to a responsive procedure (AU-C 330)","Communicate control deficiencies appropriately"],sections:[{heading:"Understand the cycle before you test it",blocks:[{p:"The purchases-and-payments (**purchase-to-pay**) cycle: a **purchase order** is approved, goods are **received** (receiving report), the vendor's **invoice (voucher)** is matched to the PO and receipt, the payment is **approved and released**, it **clears the bank**, and it **posts to the general ledger**."},{p:"You document it — narrative, flowchart, or walkthrough of one transaction end to end — and identify the **key controls**: the checks that, if they work, prevent or detect misstatement at an assertion."},{table:{head:["Control","Assertion it protects"],rows:[["Vendor master changes approved by someone outside purchasing","Occurrence (no fictitious vendors)"],["Three-way match of PO, receipt and invoice before payment","Occurrence, accuracy"],["Payment above a limit needs a second signature","Authorization"],["Monthly reconciliation of the AP subledger to the GL","Completeness, accuracy"]]}}]},{heading:"Rely on controls, or go substantive?",blocks:[{p:"If controls are well designed and you intend to rely on them, you **test their operating effectiveness** (Lesson 5) and may reduce substantive work. If they are weak — or testing them costs more than it saves — you assess control risk at maximum and rely on **substantive procedures**."},{harborline:"Harborline's AP controls were compromised this year: no dedicated approver for eleven weeks, vendor creation in the same department that raises POs, receiving in transition. A **substantive approach** across full populations is the natural response — which is what the audit plan chooses."}]},{heading:"Every risk gets a response",blocks:[{p:"AU-C 330 requires procedures **responsive** to each assessed risk at the assertion level. The discipline: a procedure earns its place by the risk it answers, not by being easy to run."},{table:{head:["Risk","Assertion","Response"],rows:[["Payments released without approval","Authorization","Test segregation of duties across all payments"],["Fictitious / duplicate vendors","Occurrence","Screen the vendor master for near-duplicates; trace to payments"],["Paying for goods never received","Occurrence","Three-way match PO, voucher, receipt"],["Payments structured below the limit","Authorization","Cluster payments by vendor and date against $10,000"],["Subledger does not support the GL","Completeness","Reconcile subledger to GL control account 2000"]]}}]},{heading:"Telling management about weaknesses",blocks:[{p:"Control deficiencies you identify are evaluated for severity. **Significant deficiencies** and **material weaknesses** must be communicated **in writing** to management and those charged with governance (AU-C 265) — whether or not they caused a misstatement."},{watch:"A control that failed is a finding even when no dollar error resulted. The approval gap is reportable on its own."}]}],standards:[["AU-C 315","Understanding internal control; identifying controls relevant to the audit"],["AU-C 330","Responses to assessed risks; tests of controls vs substantive procedures"],["AU-C 265","Communicating internal control related matters"]],check:[{q:"Controls over approvals failed for part of the year. The most defensible approach is…",options:["Test the controls anyway and rely on them","Assess control risk at maximum for that period and respond substantively","Skip the area — it was only eleven weeks","Ask management to certify the payments"],answer:1,why:"You cannot rely on a control that did not operate. Substantive testing — ideally of the whole population — answers the risk."},{q:"The three-way match protects mainly which assertions?",options:["Presentation and classification","Occurrence and accuracy","Rights and obligations","Cutoff only"],answer:1,why:"It confirms the goods were ordered and received (occurrence) at the invoiced amount (accuracy) before paying."},{q:"A significant deficiency caused no misstatement. Communicate it?",options:["No — no harm was done","Yes, in writing (AU-C 265)","Only verbally","Only if the client asks"],answer:1,why:"AU-C 265 requires written communication of significant deficiencies and material weaknesses regardless of whether they caused misstatement."}],task:{title:"Draw the cycle and the plan",intro:"Use the ten files in data/ and the audit plan (docs/02-audit-plan.md).",steps:["Sketch the purchase-to-pay flow and mark each file on it.","Mark where each of the four controls in this lesson should operate and whether Harborline's brief says it did.","For each of your Lesson 2 risks, write the responsive procedure and the files it needs."],deliver:"A one-page cycle diagram and a risk-to-procedure matrix."},noesi:{coverage:"full",summary:"Noesi's procedure library, risk linking and coverage compiler are the audit plan in executable form.",does:["Each of the **eleven procedure contracts** states its cycle, its **assertions**, the data and policies it needs, and its **limitations**.","On Planning & Risk you **link procedures to each risk**. The screen offers the procedures whose contract addresses the same assertion.","**Coverage** compiles every contract against the data you actually loaded: executable, partial (a field or policy is missing), blocked (a file is missing), or unsupported (no executor exists in this build).","**Policies** such as `split_threshold = 10000` are recorded as engagement decisions. Deselecting a procedure requires a written rationale.","Studio's Overview draws the purchase-to-pay cycle with each test placed on the link it checks."],where:["Workbench → Coverage (policies: partner chair)","Workbench → Planning & Risk (link procedures)","Studio → Overview (cycle picture)"],doesNot:["I
