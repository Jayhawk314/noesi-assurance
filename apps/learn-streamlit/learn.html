t's ending amount"}),a.jsx("div",{className:"table-wrap",children:a.jsxs("table",{children:[a.jsx("thead",{children:a.jsxs("tr",{children:[a.jsx("th",{children:"Account"}),a.jsx("th",{children:"Debit balance"}),a.jsx("th",{children:"Credit balance"})]})}),a.jsx("tbody",{children:At.trial_balance.map(u=>a.jsxs("tr",{children:[a.jsx("td",{children:u.account}),a.jsx("td",{className:"trace-money",children:u.debit?ae(u.debit):"—"}),a.jsx("td",{className:"trace-money",children:u.credit?ae(u.credit):"—"})]},u.account))})]})}),a.jsx("h3",{children:"3. Statement excerpt: see where those balances go"}),a.jsxs("div",{className:"trace-statements",children:[a.jsxs("div",{children:[a.jsx("b",{children:"Income statement"}),a.jsxs("p",{children:["Security-services expense: ",ae(c.income_statement.security_services_expense)]}),a.jsxs("p",{children:["Result in this isolated example: ",ae(c.income_statement.net_loss)," loss"]})]}),a.jsxs("div",{children:[a.jsx("b",{children:"Balance sheet"}),a.jsxs("p",{children:["Cash: ",ae(c.balance_sheet.cash)," · Accounts Payable: ",ae(c.balance_sheet.accounts_payable)]}),a.jsxs("p",{children:["Equity: ",ae(c.balance_sheet.opening_equity)," opening less ",ae(c.balance_sheet.current_loss)," loss = ",ae(c.balance_sheet.ending_equity)," ending"]})]})]}),a.jsxs("p",{className:"callout watch",children:[a.jsx("b",{children:"The open question:"})," the recorded receipt is ",ae(At.source.accepted),", leaving ",ae(At.source.unresolved_difference)," of the billed expense unsupported by that receipt. This example shows how booking the full bill would flow; it does not decide the correct adjustment."]})]})}const tn=[{n:1,slug:"fraud-why-it-happens",title:"Why fraud happens",phase:"Fraud",question:"What turns an employee into a fraudster, and how do we sort what they did?",minutes:25,objectives:["Tell fraud apart from error, and occupational fraud from organizational crime","Explain the three sides of the fraud triangle and which one an organization controls most directly","Place a scheme on one of the three branches of the ACFE's Fraud Tree","Use the latest ACFE research on how common and how costly each kind of fraud is"],sections:[{heading:"Fraud is about intent",blocks:[{p:"An **error** is an unintentional mistake: a clerk keys 1,000 instead of 100. **Fraud** is intentional deception to gain something the person is not entitled to. The two can leave identical traces in the records. What separates them is intent, and intent is exactly what records rarely show."},{p:"Two words you will meet everywhere:"},{terms:[["Occupational fraud","Someone uses their job to enrich themselves by deliberately misusing the organization's resources. The organization is the **victim**. This is the ACFE's subject and this track's."],["Organizational crime","The organization itself commits the crime, for example deceiving customers or regulators. The organization is the **offender**."]]},{p:"A financial-statement auditor sorts fraud a little differently. AU-C 240 names two kinds of intentional misstatement: **fraudulent financial reporting** (cooking the books) and **misappropriation of assets** (theft). An auditor cares about fraud because it can make the statements materially wrong."},{watch:"An exception in the data is not fraud. Noesi finds exceptions; people decide what they mean. Even then, an auditor does not make legal determinations of whether fraud occurred. That is for investigators and courts."}]},{heading:"The fraud triangle",blocks:[{p:"In the 1950s the criminologist Donald Cressey interviewed people imprisoned for embezzlement. He found three conditions present together, now called the **fraud triangle**:"},{terms:[["Pressure","A financial or personal need the person feels they cannot share or solve honestly: debt, a lender covenant, a bonus target."],["Opportunity","A way to commit the fraud and hide it: a missing approval, one person controlling a whole process, nobody reviewing."],["Rationalization",`A story that makes it feel acceptable: "I'm only borrowing it", "everyone does it", "they underpay me".`]]},{p:'An organization can do something about all three, but it controls **opportunity** most directly. That is why controls matter: pressure and rationalization live inside people, while a second approval lives in the process. Culture reaches rationalization too; "handled informally" is a culture signal as well as a control gap.'},{p:"Auditing standards use the same three ideas. AU-C 240 groups **fraud risk factors** as incentives or pressures, opportunities, and attitudes or rationalizations."},{watch:"The triangle explains fraud; it does not predict who will commit it. Most people under pressure never steal. Assess conditions and processes, never profile individuals."}]},{heading:"The Fraud Tree: three branches",blocks:[{p:"The ACFE classifies occupational fraud in its **Occupational Fraud and Abuse Classification System**, usually called the Fraud Tree. It has three branches:"},{table:{head:["Branch","What it is","In payables, for example","Share of cases (2026)","Median loss (2026)"],rows:[["Asset misappropriation","An employee steals or misuses the organization's resources","Billing through a fake vendor; altering or self-approving payments","90%","$100,000"],["Corruption","An employee misuses their influence in a business deal for a benefit","A buyer steers orders to a vendor that pays them a kickback; an undisclosed interest in a supplier","45%","$150,000"],["Financial statement fraud","Intentional misstatement or omission in the financial reports","Leaving unpaid bills out of year-end payables to flatter the current ratio","6%","$1,000,000"]]}},{p:"The shares add to more than 100% because one case can involve more than one branch. Notice the pattern: financial statement fraud is the **rarest** and the **costliest**."},{p:"Asset misappropriation splits further. The branch this track works on is **fraudulent disbursements**, where money leaves through the payment process: billing schemes, check and payment tampering, payroll, expense reimbursements and cash register disbursements. Harborline's data lets us practice the first two."}]},{heading:"What the research says",blocks:[{p:"Every two years the ACFE publishes **Occupational Fraud: A Report to the Nations**, built from cases investigated by Certified Fraud Examiners. The 2026 edition covers **2,402 cases in 143 countries and territories**. Losses exceeded $3.4 billion; the **median loss was $104,000** per case."},{p:"The report finds that organizations with anti-fraud controls, such as **management review, proactive data monitoring and surprise audits**, had lower losses and caught fraud sooner. Proactive data monitoring is what Noesi's full-population procedures do: test every payment, not a sample."},{watch:'Report to the Nations describes cases that were found and investigated. Frauds never detected are not in it. Read its numbers as "what investigated fraud looks like", not the whole picture.'}]},{heading:"Harborline through the triangle",blocks:[{harborline:'The engagement brief (`docs/01-engagement-brief.md`) gives facts for every side except personal pressure. **Pressure on management:** the lender requires audited statements within 120 days and a current ratio of at least 1.25. **Opportunity:** the AP supervisor left in June and was not replaced until September; for about eleven weeks two AP clerks released payments without a dedicated approver. Vendor setup moved to purchasing in April, so the department that raises orders now also creates the vendors it orders from. Receiving moved to scanners, and "a handful" of receipts from the transition may be missing. **Rationalization, as a culture signal:** approval limits were "handled informally".'},{p:"Notice what the brief does **not** say: nothing about any employee's debts or motives. Do not invent them. The audit responds to conditions: where opportunity is high, test harder. The next lesson turns these conditions into a fraud risk assessment."}]}],standards:[["AU-C 240","Consideration of fraud in a financial statement audit: the two kinds of fraud, fraud risk factors, the auditor's responsibilities (current standard)"],["SAS No. 151","Replaces AU-C 240 for periods ending on or after December 15, 2028 (early adoption permitted); the definition of fraud is unchanged"],["ACFE Fraud Tree","The Occupational Fraud and Abuse Classification System: corruption, asset misappropriation, financial statement fraud"],["ACFE Report to the Nations 2026","2,402 cases; median loss $104,000; branch shares and median losses quoted above"]],check:[{q:"An AP clerk keys a $4,500 invoice as $5,400 by mistake, and it is paid. What is it?",options:["Asset misappropriation","An error, not fraud","Corruption","Financial statement fraud"],answer:1,why:"There is no intent to deceive. It is a misstatement that needs correcting, but fraud requires intent. The traces in the data could look the same, which is why intent has to be established, not assumed."},{q:"Which side of the fraud triangle can an organization reduce most directly?",options:["Pressure","Opportunity","Rationalization","None; all three are personal"],answer:1,why:"Controls such as independent approval, segregation of duties and review remove or shrink opportunity. Pressure and rationalization live inside people, though culture influences rationalization."},{q:"A purchasing manager steers contracts to a supplier that secretly pays him 5% of each invoice. Which branch of the Fraud Tree?",options:["Corruption","Asset misappropriation","Financial statement fraud","Organizational crime"],answer:0,why:"He misuses his influence in a business transaction for a personal benefit: a kickback, which is bribery under corruption. The company may also overpay, but the scheme is classified by how it works."},{q:"In the ACFE's 2026 report, which branch had the highest median loss per case?",options:["Asset misappropriation","Corruption","Financial statement fraud","They were about equal"],answer:2,why:"Financial statement fraud: a median of $1,000,000, although it appeared in only 6% of cases. Asset misappropriation was the most common (90%) with the lowest median ($100,000)."},{q:`The brief says Harborline's approval limits were "handled informally" during the supervisor gap. Which side of the triangle does that mainly describe?`,options:["Pressure","Opportunity","Rationalization only","None of them"],answer:1,why:'Informal approval means payments could be released without an independent check, which is opportunity. It is also a culture signal that can feed rationalization ("nobody follows the limit anyway").'}],task:{title:"Classify the schemes and map Harborline's triangle",intro:"Use the engagement brief (`case-studies/harborline-marine/docs/01-engagement-brief.md`) and this lesson.",steps:["Name the Fraud Tree branch for each: (a) a clerk sets up a vendor in her cousin's name and bills for services never delivered; (b) a controller leaves December invoices out of payables; (c) a buyer accepts season tickets from a supplier bidding for a contract; (d) a clerk alters the payee on a check; (e) a manager records next year's sales in December; (f) a buyer owns part of a supplier he approves orders from.","Draw the fraud triangle for Harborline. Under each side, list the facts from the brief that belong there, with a quote.","Mark each fact as bearing on **management** (financial statement fraud) or on **employees** (asset misappropriation or corruption).","Write one sentence on what the brief does not tell you, and why you should not fill that gap by guessing."],deliver:"A one-page classification and triangle, ready to feed the fraud risk assessment in the next lesson."},noesi:{coverage:"none",summary:"This lesson is the thinking that comes before any tool. Noesi does not assess anyone's pressure or motives, and it does not classify schemes. It does run the payables tests that later lessons use to find the traces schemes leave.",does:["Its procedures look for the traces of **fraudulent disbursements** that later lessons teach: look-alike vendors (`ap.vendor_relational_twins`), self-approved payments (`ap.segregation_of_duties`), payments split under an approval limit (`ap.split_payment_review`), and money that goes out and comes back (`forensic.closed_value_flow`).",'Each finding carries its own stated limitation, for example "a twin is an investigation lead, not proof of duplication or fraud".'],where:["Workbench → Runs & Findings","Workbench → 📖 manual, chapter 5 (the procedures and their limits)"],doesNot:["It does not judge intent, and it never labels a finding as fraud.","It does not record fraud risk factors or the fraud triangle; you write those into the risk register (next lesson)."]}},{n:2,slug:"fraud-risk-assessment",title:"Fraud risk assessment",phase:"Fraud",question:"Where could fraud happen here, what would stop it, and what do we test?",minutes:35,objectives:["Tell a fraud from a fraud risk, and inherent risk from residual risk","Carry out the steps of a fraud risk assessment for one process","Describe the auditor's fraud responsibilities under AU-C 240, and what SAS No. 151 changes","Link each fraud risk to a control and to a specific audit response"],sections:[{heading:"A fraud risk is not a fraud",blocks:[{p:"A **fraud** is something that happened. A **fraud risk** is a way fraud could happen in a process, whether or not anyone has tried. A fraud risk assessment lists those ways before anyone is accused of anything."},{terms:[["Inherent risk","The risk before any controls: how likely and how damaging a scheme would be if nothing stood in its way."],["Residual risk","The risk left after the controls that actually operate. A control that exists on paper but was not performed does not lower it."],["Internal vs external fraud risk","Schemes by insiders (employees, management) vs outsiders (vendors, customers, hackers). Many payables schemes combine both, such as an employee colluding with a vendor."]]},{p:"Management owns the organization's fraud risk management. In the widely used COSO internal control framework, one principle of the **risk assessment** component is that the organization considers the potential for fraud. The COSO and ACFE **Fraud Risk Management Guide** builds a full program around it. The auditor makes a separate assessment for the audit."}]},{heading:"The steps",blocks:[{steps:["**Understand the process** and who can move money or change records in it: who creates vendors, who enters bills, who approves and releases payments.","**Brainstorm the schemes.** Walk the Fraud Tree: how could someone steal here, bribe here, or misstate here? Think like the person who wants to do it.","**Rate inherent risk**, meaning likelihood and impact, before controls.","**Identify the anti-fraud controls**, preventive (stop it) or detective (catch it), and find out whether they actually operated.","**Rate residual risk**, what is left after the controls that operate.","**Respond** to each residual risk: accept it, reduce it with a control, avoid the activity, or transfer it (for example insurance), within the organization's risk appetite. For an auditor, respond with specific audit procedures."]},{watch:"The most common mistake is rating residual risk from the control design. Harborline had an approval limit on paper; during the supervisor gap nobody enforced it. Residual risk follows what operated, not what was written."}]},{heading:"The auditor's responsibility today: AU-C 240",blocks:[{p:"The auditor's objective is **reasonable assurance** that the statements are free of material misstatement, **whether due to fraud or error**. AU-C 240 turns that into specific work:"},{list:["Keep **professional skepticism** throughout: recognize that fraud could exist regardless of past experience with the client's honesty.","Hold an **engagement team discussion** about how and where the statements could be misstated by fraud.","**Inquire** of management and others about fraud risks, known or suspected fraud, and how management responds to them.","Evaluate **fraud risk factors**: incentives or pressures, opportunities, attitudes or rationalizations.","Presume a fraud risk in **revenue recognition**. The presumption can be overcome only with documented reasons.","Treat **management override of controls** as a risk in every audit. Respond by testing journal entries, reviewing accounting estimates for bias, and evaluating the business reason for significant unusual transactions.","Build **unpredictability** into the procedures, and communicate identified or suspected fraud to the appropriate level of management and to those charged with governance."]},{watch:"A new standard is coming. The AICPA approved **SAS No. 151** in August 2026. It replaces AU-C 240 for audits of periods ending on or after **December 15, 2028** (early adoption permitted). It applies a fraud lens to the AU-C 315 risk assessment, requires understanding the entity's **whistleblower program** where one exists, and expands the responses and communications when fraud is identified or suspected. The definition of fraud and the auditor's overall objective do not change. Harborline's 2026 audit follows AU-C 240."}]},{heading:"Harborline's payables fraud risks",blocks:[{p:"Here the brief's conditions from Lesson F1 become assessed risks. Three are worked through; the task asks you to finish the register."},{table:{head:["Condition (brief)","Scheme it enables","Inherent","Control, and did it operate?","Residual","Audit response"],rows:[["AP supervisor gone June–September","Payments entered and approved by the same clerk; payments with no valid bill","High","Independent payment approval: **not operating** for about eleven weeks","High","Test **every** payment for creator = approver; examine all gap-period payments to supporting bills"],["Vendor setup moved to purchasing (April)","A shell or duplicate vendor created and then ordered from by the same department","High","Independent review of vendor master changes: **unknown**, so ask and test","High until shown otherwise","Compare vendors on tax ID, name and address; trace new vendors to real business"],["$10,000 payment approval limit","Splitting one purchase into several payments just under the limit","Moderate","The limit, but no monitoring of clusters","Moderate","Look for several payments to one vendor, just under $10,000, within a few days"]]}},{harborline:"Two more to finish yourself. **Scanner receiving**: missing receipts could hide bills for goods never delivered. **The lender covenant**: leaving unpaid bills out of year-end payables would lower current liabilities and flatter the current ratio. That is a financial statement fraud risk for management, and the classic response is a **search for unrecorded liabilities** in payments made after year end."}]},{heading:"From risk to response",blocks:[{p:"Every residual risk needs an answer in the audit plan: which procedure, on what population, when. For payables, testing the **whole population** is the strongest answer a data tool gives. It cannot miss a self-approved payment because it wasn't in the sample."},{p:"Some fraud risks cannot be answered with payables data at all. Management override needs journal-entry testing; the revenue presumption needs revenue procedures. A good assessment says which risks it answered, and how, and which it answered some other way."}]}],standards:[["AU-C 240","The auditor's fraud responsibilities: skepticism, team discussion, inquiries, fraud risk factors, the revenue presumption, management override, unpredictability, communication"],["SAS No. 151","Approved August 2026; replaces AU-C 240 for periods ending on or after December 15, 2028; fraud lens on AU-C 315, whistleblower programs, responses and communications"],["AU-C 315","Identifying and assessing risks of material misstatement, including inherent and control risk"],["COSO Internal Control framework (2013)","Five components; the risk assessment component includes considering the potential for fraud"],["COSO / ACFE Fraud Risk Management Guide","Management's fraud risk program: governance, assessment, prevention and detection, investigation, monitoring"]],check:[{q:"A control is designed but was not performed for three months. How does it affect residual risk for those months?",options:["It lowers residual risk as designed","It does not lower residual risk; residual risk follows the controls that operated","Residual risk becomes zero","It only affects inherent risk"],answer:1,why:"Residual risk is what is left after controls that actually work. Harborline's approval limit during the supervisor gap is exactly this case."},{q:"Which response does AU-C 240 require in every audit, because management override is always a risk?",options:["Confirming all receivables","Testing journal entries, reviewing estimates for bias, and evaluating significant unusual transactions","Observing the inventory count","Interviewing every employee"],answer:1,why:"Management can override any control, so the standard prescribes these three responses regardless of the assessed risk."},{q:"Harborline moved vendor setup into purchasing. Which scheme risk rises most?",options:["Payroll ghost employees","A shell or duplicate vendor that the same department then orders from and bills through","Cash register skimming","Revenue recognized too early"],answer:1,why:"When one department both creates vendors and raises orders, nobody independent checks that a new vendor is real. That is the opportunity a billing scheme needs."},{q:"An auditor wants to rebut the presumed fraud risk in revenue recognition. What must they do?",options:["Nothing; it is optional","Document the reasons the presumption is overcome","Get the client's written consent","It can never be rebutted"],answer:1,why:"AU-C 240 presumes the risk; overcoming it is allowed, but only with documented reasons."},{q:"Harborline's 2026 year-end audit: which fraud standard applies?",options:["SAS No. 151 is mandatory","AU-C 240; SAS No. 151 applies to periods ending on or after December 15, 2028, with early adoption permitted","Neither; fraud is not an audit matter","PCAOB AS 2401 only"],answer:1,why:"SAS No. 151 was approved in August 2026 but is not yet effective for a December 2026 year end. A firm could adopt it early, but by default AU-C 240 applies."}],task:{title:"Build Harborline's payables fraud risk register",intro:"Use the brief, the audit plan (`docs/02-audit-plan.md`) and this lesson.",steps:["List every condition in the brief that creates a payables fraud risk, including the approval limit and the lender covenant.","For each: the scheme it enables (with its Fraud Tree branch), inherent risk, the control and whether it operated, and residual risk.","Write a specific audit response for each residual risk: which records, which test, whole population or sample, and why.","Mark the risks that payables data cannot answer (for example management override) and name the procedure that would.",`Enter your three highest risks in Noesi's risk register (Workbench → Planning & Risk) with "Fraud:" at the start of each title, and link the procedures that respond.`],deliver:"A fraud risk register of five to seven rows, and three risks recorded and linked in Noesi."},noesi:{coverage:"partial",summary:"Noesi keeps the assessed risks and links each one to the procedures that answer it, with a second person's agreement for the serious ones. It does not have a separate fraud category, and it cannot answer fraud risks that need data it does not test.",does:["The **risk register** records a title, the assertion at risk (occurrence, completeness, accuracy, authorization or cutoff), a level from unassessed to significant, a rationale and a planned response.","Each risk links to the **procedures that respond** to it; Coverage then shows whether the data you loaded can actually run them.","A risk rated **high** or **significant** needs a second person's concurrence. Completion is blocked while any risk is unassessed, or while a high or significant risk has no response or no linked procedure."],where:["Workbench → Planning & Risk","Workbench → Coverage","Workbench → 📖 manual, chapter 2"],doesNot:["It has no fraud flag or fraud-risk-factor fields. Name fraud in the title and rationale.","It does not test journal entries, estimates or revenue, so management override and the revenue presumption need work outside it.","It keeps no record of the team discussion or the inquiries AU-C 240 requires."],tryIt:'Start with --demo, open Planning & Risk, and add "Fraud: self-approved payments during the supervisor gap" against authorization, linked to ap.segregation_of_duties.'}},{n:3,slug:"fraud-billing-schemes",title:"Billing schemes and shell vendors",phase:"Fraud",question:"How does a fake or duplicated bill get paid, and what trace does it leave?",minutes:35,objectives:["Describe the three kinds of billing scheme: shell company, non-accomplice vendor and personal purchases","Recognize the red flags of a shell or duplicate vendor in a vendor master","Explain how duplicate invoices and bills for goods never received get through","Name the prevention and detection controls for billing schemes"],sections:[{heading:"Billing schemes: making the company pay a false bill",blocks:[{p:"In a **billing scheme** the fraudster makes the organization pay an invoice it does not owe. The payment process itself does the stealing; nobody has to touch cash. That is why billing schemes are among the most common fraudulent disbursements."},{terms:[["Shell company scheme","The fraudster creates a fictitious vendor, often with a name close to a real one, and bills for goods or services that never existed. The payments go to an account they control."],["Non-accomplice vendor scheme",'A real vendor is used without knowing it: the fraudster pays the same invoice twice and intercepts the refund, or inflates a genuine invoice ("pay and return" and overbilling).'],["Personal purchases","The fraudster buys things for themselves with company money and codes the invoice as a business expense."]]},{watch:"Services are easier to fake than goods. Nothing has to arrive at the warehouse, so there is no receiving record to contradict the bill."}]},{heading:"Red flags in the vendor master",blocks:[{p:"A shell vendor has to exist in the vendor master before it can be paid. That makes the vendor list one of the best places to look:"},{list:["Two vendors with the **same tax ID**, bank account or address, but different vendor numbers.",'Near-identical names: "Harbor" and "Harbour", "Inc" and "Inc.", "&" and "and".',"A vendor whose address or bank account matches an **employee's**.","A P.O. box or mail drop as the only address; no phone; a tax ID that does not validate.","A new vendor that quickly receives large or frequent payments, often round amounts, for vague services."]},{p:"Who can **create** a vendor matters as much as who can pay one. If the same person or department can set up a vendor, raise its order and approve its bill, one person can run the whole scheme."}]},{heading:"Duplicate bills and goods never received",blocks:[{p:"Two quieter versions leave traces in the document chain rather than the vendor list:"},{list:["**Duplicate invoice**: the same purchase billed twice, for example with a new invoice number, a slightly different date, or a second voucher against the same purchase order. One payment is real; the other is the theft.","**Billing for goods never received**: an invoice is paid although no receipt shows the goods arrived, or arrived in a smaller quantity than billed. This is what the **three-way match** (order, receipt, invoice) exists to stop."]},{p:"**Prevention:** independent vendor setup and review, a three-way match before payment, and a system check for duplicate invoice numbers and amounts. **Detection:** compare the vendor master against itself and against employee records, test every paid invoice for a receipt, and look for the same vendor, amount and order paid twice."}]},{heading:"Harborline: look-alike vendors and a second bill",blocks:[{harborline:'Three pairs of vendors share a remit city (Norfolk) **and a tax ID**: V1038 "Harbor Marine Supply LLC" and V1039 "Harbour Marine Supply, L.L.C."; V1040 "Nautical Parts Inc" and V1041 "Nautical Parts, Inc."; V1042 "Coastal Fuel & Marine Services" and V1043 "Coastal Fuel and Marine Svcs". **Both identities in every pair are being paid.** Remember that vendor setup moved into purchasing in April.'},{harborline:"PAY-2026-0013 (21,619.99 to Gulfstream Propulsion) cites voucher VCH-2026-9338, which is **not in the voucher file**. When the client later sends a corrected file (Assignment 11), 9338 appears: same vendor, same amount and same purchase order as VCH-2026-0013, entered one week later. That is the shape of a duplicate invoice."},{harborline:"Seven vouchers fail the three-way match: four were paid with **no receipt at all** (VCH-2026-0010, 0020, 0043, 0116) and three were billed for more than was received (0009, 0078, 0104)."},{watch:"Each of these is a lead. Look-alike vendors can be a legitimate company entered twice by mistake; a missing receipt can be a lost scan from the receiving change. The job is to find out which, not to assume."}]}],standards:[["ACFE Fraud Tree","Billing schemes (shell company, non-accomplice vendor, personal purchases) under fraudulent disbursements"],["CFE exam 2026, section 1","Asset misappropriation: fraudulent disbursements (13%); procurement fraud (8%)"],["AU-C 240","Misappropriation of assets as a source of material misstatement; fraud risk factors"]],check:[{q:'A clerk sets up "Harbour Supply LLC" next to the real "Harbor Supply LLC", with her own bank account, and bills for consulting. What kind of scheme?',options:["Non-accomplice vendor scheme","Shell company scheme","Personal purchases","Payment tampering"],answer:1,why:"The vendor is fictitious and the payments go to an account she controls. A look-alike name helps the fake vendor blend in."},{q:"Which single fact in a vendor master is the strongest duplicate-vendor signal?",options:["Both vendors are in the same city","Two vendor numbers share one tax ID","The vendor was created this year","The vendor sells services"],answer:1,why:"A tax ID identifies one taxpayer. Two vendor records with the same one are the same business, or someone copying a real business's identity."},{q:"An invoice is paid twice: once on the original voucher and once on a new voucher for the same purchase order. What control would most directly have stopped it?",options:["Bank reconciliation","A check for duplicate invoices against the same vendor, amount and order before payment","Physical inventory count","Management representation letter"],answer:1,why:"A duplicate check at the point of entry or payment stops the second bill. A bank reconciliation would show both payments as legitimately cleared."},{q:"Why are billing schemes for services harder to detect than for goods?",options:["Services cost more","No receiving record has to contradict the bill","Services are never audited","Service vendors have no tax ID"],answer:1,why:"Goods should produce a receipt that the three-way match can check. A service leaves nothing at the loading dock, so the approver's knowledge is the main control."}],task:{title:"Find the look-alikes before Noesi does",intro:"Use `case-studies/harborline-marine/data/vendors.csv`, `vouchers.csv` and `payments.csv` in a spreadsheet.",steps:["Sort `vendors.csv` by **Tax ID**. List every tax ID used by more than one vendor number.","For each pair, count the vouchers and payments to each vendor number. Is only one identity active, or both?","In `payments.csv`, list payments whose voucher number is not in `vouchers.csv`. For each, what would you ask the client?","For one pair, write what evidence would show it is a harmless duplicate entry, and what would show a shell vendor."],deliver:"A one-page vendor analysis: the pairs, their activity, and the evidence you would request."},noesi:{coverage:"partial",summary:"Noesi finds look-alike vendors by name, payments that cite vouchers missing from the file, and vouchers paid without a matching receipt. It does not compare tax IDs or bank accounts, and it has no duplicate-invoice test.",does:['`ap.vendor_relational_twins` flags vendors with **near-identical names** (and vendors with near-identical activity). Its stated limit: "A structural twin is an investigation lead, not proof of duplication or fraud."',"`ap.payment_voucher_reference` flags payments whose voucher is **not in the voucher population**, like PAY-2026-0013.","`ap.three_way_receipt_match` flags vouchers paid with no receipt, or billed above what was received."],where:["Workbench → Runs & Findings","Workbench → What Changed (for the corrected file in Assignment 11)"],doesNot:["It reads only vendor number and name, so **shared tax IDs, addresses or bank accounts** are yours to find.","It has **no duplicate-invoice test**. VCH-2026-9338 is found by reading the data, not by a procedure.","It does not compare vendors with employee records."],tryIt:"Start with --demo, run ap.vendor_relational_twins, and compare its pairs with the tax-ID pairs from your spreadsheet."}},{n:4,slug:"fraud-payment-tampering",title:"Payment tampering, self-approval and split payments",phase:"Fraud",question:"How are payment controls bypassed, and where does it show?",minutes:35,objectives:["Describe the main payment tampering schemes, on paper checks and electronic payments","Explain why one person entering and approving a payment is a control failure, not a finding of fraud","Recognize payments split to stay under an approval limit","Use the bank and the general ledger as independent checks on the payment records"],sections:[{heading:"Payment tampering",blocks:[{p:"In **payment tampering** the fraudster takes control of a payment itself rather than inventing a bill. With paper checks the classic forms are:"},{terms:[["Forged maker","Signing a company check without authority."],["Forged endorsement","Intercepting a check made out to someone else and endorsing it to yourself."],["Altered payee or amount","Changing who a legitimate check pays, or how much, after it is approved."],["Authorized maker","Someone allowed to sign or release payments simply pays themselves or an accomplice."],["Concealed check","Slipping a check into a batch so an approver signs without reading it."]]},{p:"Electronic payments have the same shapes: changing the bank account on a vendor record, or releasing a payment you also approved. Tampering needs concealment afterwards, so it often leaves a mismatch between the **payment record**, the **bank** and the **general ledger**."}]},{heading:"Self-approval and approval limits",blocks:[{p:"The core payment control is **segregation of duties**: the person who enters a payment is not the person who approves it. When one person does both, nothing independent stands between that person and the money. That is the **authorized maker** opportunity."},{p:"An **approval limit** adds a second layer: payments above, say, $10,000 need a more senior approver. The standard way around it is **splitting**: several payments to one vendor, each just under the limit, within a few days."},{watch:`Self-approval is a control failure, not proof of fraud. The engine's own limit says "Field semantics and compensating controls require auditor evaluation." The approver field may mean something else in the system, or another control may have covered the gap. Find out before concluding.`}]},{heading:"Three independent records: payments, bank, ledger",blocks:[{p:"A payment is recorded in the payments file, clears through the **bank**, and posts to the **general ledger**. The bank is the most independent of the three: the company does not write the bank's records."},{table:{head:["What you see","What it can mean"],rows:[["The bank paid **more** than the payment record shows","An altered check amount, or an error; the classic trace of tampering"],["A recorded payment never clears the bank","An outstanding check, a voided payment still on the books, or a record that hides something"],["A payment never posts to the ledger, or posts a different amount",'A posting error, or concealment: the ledger is where a theft would be hidden or "forced" to balance'],["A payment exceeds its voucher, or is dated before it","Overpayment (possibly returned to someone), or a bill created after the fact to support a payment"]]}}]},{heading:"Harborline: the payment records",blocks:[{harborline:"**Self-approval:** five payments were entered and approved by the same AP clerk: E227 Alice Bergeron (PAY-2026-0013 on July 5, PAY-2026-0064 on September 13, PAY-2026-0055 on January 8, 2027) and E231 Ken Nakashima (PAY-2026-0049 in March, PAY-2026-0007 on August 1). Three of the five fall between July and mid-September, while the AP supervisor's post was empty."},{harborline:"**Split payments:** V1042 Coastal Fuel & Marine Services received five payments between September 14 and 22: 9,850, 9,720, 9,905, 9,640 and 9,880, each **just under the $10,000 approval limit**, totalling 48,995. V1042 is also one half of a look-alike pair from Lesson F3."},{harborline:"**Bank and ledger:** PAY-2026-0006 is recorded at 20,084.72, but the bank cleared **20,787.69**, 702.97 more. Four payments (PAY-2026-0001, 0038, 0052, 0116) never cleared the bank. Three never posted to the ledger (0008, 0017, 0058), and two posted the wrong amount (0003, 0004). Three payments exceed their vouchers by 4,132 to 5,898 (PAY-2026-0016, 0093, 0109), and two are dated before their vouchers (0018, 0085)."},{watch:"PAY-2026-0116 appears twice: its voucher was paid with no receipt (F3) and the payment never cleared the bank. When one transaction fails several independent tests, it moves up the list."}]}],standards:[["ACFE Fraud Tree","Check and payment tampering (forged maker, forged endorsement, altered payee, authorized maker, concealed checks) under fraudulent disbursements"],["CFE exam 2026, section 1","Fraudulent disbursements (13%): types, prevention and detection of payment tampering and billing schemes"],["AU-C 240","Fraud risk factors: opportunities from inadequate segregation of duties and approval controls"],["COSO Internal Control framework","Control activities: segregation of duties and authorization"]],check:[{q:"The bank cleared a check for $20,787.69, but the payment record says $20,084.72. Which scheme does this most suggest?",options:["Shell company","Altered check amount","Personal purchases","Forged endorsement only"],answer:1,why:"The check paid more than was approved and recorded. An altered amount is the classic explanation, though a keying error is possible too; the check image would decide."},{q:"One clerk enters and approves a payment. What is the right conclusion?",options:["The clerk committed fraud","A segregation-of-duties control failed for that payment; find out what the fields mean and whether another control covered it","Nothing; clerks may approve","Reverse the payment"],answer:1,why:"It is a control failure and an opportunity, not proof. Noesi's own limitation says field meanings and compensating controls need auditor evaluation."},{q:"Five payments of 9,640 to 9,905 to one vendor in nine days, with a $10,000 approval limit. What is the concern?",options:["Duplicate vendor","Splitting to stay under the approval limit","Late payment","Nothing: each payment is within the limit"],answer:1,why:"Each payment is within the limit, which is exactly the point. Together they are 48,995, well above what one approver could release. The business purpose needs review."},{q:"Why is the bank the strongest of the three records (payments, bank, ledger)?",options:["It is the largest file","It is produced outside the company, so staff cannot easily alter it","It includes vendor names","It is always complete"],answer:1,why:"Independent, third-party evidence is more reliable than records the client produces itself (AU-C 500). A fraudster can alter the payments file or the ledger far more easily than the bank's records."}],task:{title:"Test the payment controls yourself",intro:"Use `payments.csv`, `bank.csv`, `gl.csv` and `employees.csv` from `case-studies/harborline-marine/data/`.",steps:["Filter `payments.csv` for rows where **Created By** equals **Approved By**. Look the clerk up in `employees.csv` and note each payment's date.","Mark which of those dates fall in the June to September supervisor gap.","Sort payments by vendor and date. Find any vendor with three or more payments between 9,000 and 9,999 within ten days.","Match each payment to `bank.csv` by payment number. List payments that never cleared and payments where the bank amount differs from the recorded amount.","For PAY-2026-0006, write the three explanations you would consider and the one document that would decide."],deliver:"A payment-controls worksheet with your exceptions, before you compare them with Noesi's findings."},noesi:{coverage:"full",summary:"This lesson's tests are Noesi's strongest ground: it tests every payment for self-approval, splitting, bank clearing, ledger posting and the document chain. It reports exceptions; it does not decide whether any of them is fraud.",does:["`ap.segregation_of_duties` flags payments with the same creator and approver, or no approver.",'`ap.split_payment_review` groups payments to one vendor below the approved **split threshold** within a window of days (both are engagement policies you set). Its limit: "A cluster is advisory and requires business-purpose review."',"`cash.bank_clearing` compares every payment with the bank (2% tolerance); `gl.payment_posting` checks every payment reached the ledger at the right amount.",'`ap.document_chain` checks order, voucher and payment agree in amount and date order. Its limit: "Document-chain coherence does not authenticate any document."'],where:["Workbench → Runs & Findings","Workbench → Coverage (split policies)","Studio → Exceptions"],doesNot:["It does not examine check images, signatures or endorsements, so it cannot tell an altered check from a keying error.","It does not watch changes to vendor bank accounts.","It never concludes intent; every finding waits for your disposition."],tryIt:"Start with --demo and run all four payment procedures. Compare Noesi's findings with your worksheet, then look for payments that appear in more than one."}}],gu=[["F5","Following one person"],["F6","Corruption and kickbacks in purchasing"],["F7","Following the money"],["F8","Data analysis for fraud detection"],["F9","Preventing it next time"]],tp=[{n:10,slug:"completion",title:"Completing the audit and the report",phase:"Completion",question:"Taken together, are the statements fairly presented — and what do we sign?",minutes:40,objectives:["Evaluate uncorrected misstatements against materiality","Perform the completion procedures: subsequent events, going concern, representations","Choose the right opinion","Assemble and retain the audit file"],sections:[{heading:"Evaluate the misstatements",blocks:[{p:"AU-C 450: **accumulate** identified misstatements (except clearly trivial ones), **communicate** them to management and ask for correction, then **evaluate** what remains uncorrected — individually and in aggregate, quantitatively and qualitatively — against materiality. The working paper is the **summary of audit differences (SAD)**."},{p:"If uncorrected misstatements approach performance materiality, the risk that undetected misstatement pushes the total over materiality rises. You may need more work, or a harder conversation with management."}]},{heading:"Completion procedures",blocks:[{terms:[["Final analytical review","Read the statements as a whole. Do they make sense given everything you learned (AU-C 520)?"],["Subsequent events (AU-C 560)","Events after year end up to the report date. **Recognized** events give evidence about conditions at year end, such as a customer's bankruptcy in February for a December balance, and are adjusted. **Nonrecognized** events arise afterwards, such as a fire in March, and may need disclosure."],["Going concern (AU-C 570)","Is there substantial doubt about the entity continuing for **one year after the statements are issued** (or available to be issued)? Covenant breaches and refinancing needs are classic indicators."],["Written representations (AU-C 580)","Management's letter confirming its responsibilities and key matters, **dated as of the report date**. Refusal is a scope limitation."],["Engagement review","The partner's and reviewer's final review of the file, and resolution of open points."]]},{p:"You also communicate with **those charged with governance** (AU-C 260): significant findings, difficulties, uncorrected misstatements. Written communication of control deficiencies (AU-C 265, from Lesson 4) goes out now if it has not already."}]},{heading:"Choosing the opinion",blocks:[{table:{head:["Situation","Opinion"],rows:[["Fairly presented; sufficient evidence","**Unmodified** (clean), AU-C 700"],["Material but not pervasive misstatement, or scope limitation","**Qualified** ('except for'), AU-C 705"],["Material and pervasive misstatement","**Adverse**"],["Possible effects of a scope limitation material and pervasive","**Disclaimer** of opinion"]]}},{p:"Separately, AU-C 706 **emphasis-of-matter** paragraphs draw attention to properly presented matters, and going-concern doubt has its own required reporting."}]},{heading:"Assembling the file",blocks:[{p:"After the report is released, the file is **assembled** into its final form within **60 days** (AU-C 230) and retained at least **5 years**. Public-company audits follow PCAOB AS 1215: **7 years** of retention, and an assembly window of 45 days that the amended AS 1215, effective December 15, 2026, shortens to **14 days**. After assembly, nothing is deleted. Any later change records **the specific reason, who made it, and when**, and preserves the original."},{harborline:"With the planted exceptions dispositioned honestly, Harborline's uncorrected total stays under $420,000. The interesting output is not the conclusion but the trail behind it: every exception judged with a note, every above-trivial judgment concurred, every run reviewed and approved."}]}],standards:[["AU-C 450","Evaluation of misstatements; the SAD"],["AU-C 560 / 570 / 580","Subsequent events; going concern; written representations"],["AU-C 260 / 265","Communication with governance; control deficiencies"],["AU-C 700 / 705 / 706","Forming the opinion; modifications; emphasis-of-matter"],["AU-C 230 / PCAOB AS 1215","Documentation: assembly within 60 days (AICPA) or 14 days (PCAOB, amended AS 1215 effective 12/15/2026, previously 45); retention 5 / 7 years"]],check:[{q:"In February a major customer goes bankrupt. It was already failing at 31 December. This is…",options:["a nonrecognized subsequent event — disclose only","a recognized subsequent event — adjust the year-end allowance","irrelevant to the audit","a going-concern issue for the auditor"],answer:1,why:"It gives evidence about a condition that existed at year end, so the statements are adjusted."},{q:"Management refuses to sign the representation letter. The effect is…",options:["none — it is a formality","a scope limitation that affects the opinion","an adverse opinion automatically","the auditor signs it instead"],answer:1,why:"Written representations are required evidence. Refusal limits scope and normally leads to a disclaimer or withdrawal."},{q:"After the file is assembled, a workpaper must be corrected. You…",options:["overwrite the page","document the reason, who and when, and preserve the original","start a new file","cannot change anything, ever"],answer:1,why:"AU-C 230 allows post-assembly changes only with that documentation and without deleting the prior record."}],task:{title:"Complete the file",intro:"Using your dispositions from Lesson 6 and the materiality from Lesson 3:",steps:["Build the SAD: list uncorrected misstatements and total them against 21,000, 315,000 and 420,000.","Write one line for each completion check: final analytics, subsequent events, going concern, representations, evidence sufficiency, engagement review.","State the opinion you would issue and why, including any limitation you recorded along the way."],deliver:"A completion memo and a draft opinion paragraph."},noesi:{coverage:"full",summary:"Completion is where Noesi is strictest. It refuses to let the file close until every gate is green, then seals the file so anyone can verify it.",does:["The **SAD** totals unadjusted differences against materiality, performance materiality and clearly trivial, and concludes immaterial or material. It refuses to conclude over undisposed or unconcurred judgments.","The **six completion checks** — final analytical review, subsequent events, going concern, management representations, evidence sufficiency, engagement review — each need a note, not just a tick.","**Readiness** names every blocker. Studio's Conclusion view lists them in plain words.","**Lock** (partner): a signed, frozen record of the whole file, anchored to the journal. **Export** produces an evidence packet that re-verifies **offline**, with no tool and no vendor.","**Reopen** only with a written reason. The old lock is kept forever, and the next lock names its predecessor, which is the AU-C 230 rule built into the structure."],where:["Studio → Conclusion (SAD, blockers)","Workbench → SAD & Completion","Workbench → Lock & Export (partner chair)"],doesNot:["It does not decide or write the opinion, and it does not issue the report.","It does not perform the subsequent-events or going-concern work. It records that you did it.","The lock proves the **file's** integrity, not the **audit's** quality. A signed archive of thin work is still thin work."],tryIt:"Lock the Harborline demo, then reopen it with a reason. Rerun one procedure and watch the re-lock refuse until the rerun is reviewed and approved."}}],np=[{n:5,slug:"evidence-and-testing",title:"Evidence, sampling and tests of transactions",phase:"Fieldwork",question:"What counts as evidence, and how much is enough?",minutes:35,objectives:["Judge evidence by relevance and reliability","Distinguish tests of controls from substantive tests of transactions","Design an attribute sample and evaluate deviations","Know what full-population testing changes — and what it does not"],sections:[{heading:"Sufficient, appropriate evidence",blocks:[{p:"AU-C 500 (as revised by SAS 142) asks for evidence that is **sufficient** (enough) and **appropriate** (relevant and reliable). Reliability depends on the source and how you got it:"},{list:["**independent, external** evidence beats internal evidence (a bank statement beats a client ledger);","evidence you obtain **directly** beats evidence obtained indirectly;","evidence from an entity with **effective controls** is more reliable than from one without;","**documents** and **originals** beat oral statements and copies."]},{p:"Data the client extracts from its system is itself evidence you must evaluate: is the population **complete** and **accurate**? A test run on half a population proves nothing about the other half."}]},{heading:"Two kinds of test",blocks:[{terms:[["Test of controls","Did the control operate throughout the period? (Was each payment above $10,000 actually second-signed?) The output is a deviation rate."],["Substantive test of transactions","Is the transaction itself right — did it occur, at the right amount, in the right period? (Vouch a payment to its invoice, PO and receipt.) The output is a dollar misstatement."]]},{p:"Often one procedure does both at once — a **dual-purpose test**: while vouching a payment's documents you also check the approval signature."}]},{heading:"Sampling",blocks:[{p:"When you cannot examine everything, you **sample** (AU-C 530). For a test of controls (**attribute sampling**):"},{steps:["Define the **attribute** (evidence of approval) and what counts as a **deviation**.","Define the **population** and confirm it is complete.","Set the **tolerable deviation rate**, the **expected rate**, and your risk of over-reliance; these drive the sample size.","Select items **randomly** or systematically so every item has a chance.","Test, count deviations, compute the **upper deviation limit**, and compare it with the tolerable rate."]},{p:"If the upper limit exceeds the tolerable rate, the control cannot be relied on as planned: raise control risk and do more substantive work."}]},{heading:"Full-population testing",blocks:[{p:"With the client's data in hand, software can compare **every** payment with its voucher, PO, receipt and bank clearing. That removes sampling risk — but three things stay true:"},{list:["**Silence means 'within tolerance', not 'nothing there'.** Every automated comparison has a tolerance; know it before you call a result clean.","**An exception is not a misstatement.** It is an exposure to investigate (Lesson 6).","**Matching records do not authenticate documents.** A forged invoice that matches a forged PO passes a match."]},{harborline:"Run across Harborline's full populations, the eleven procedures report **52 findings**. The bank-clearing test is silent on one planted difference of 0.9% because its tolerance is 2% — a student reconciling by hand finds what the software correctly does not flag."}]}],standards:[["AU-C 500 (SAS 142)","Audit evidence: sufficiency, relevance, reliability; information produced by the entity"],["AU-C 530","Audit sampling"],["AU-C 330","Tests of controls and substantive procedures"]],check:[{q:"Which evidence is most reliable?",options:["The client's AP aging","A bank statement obtained directly from the bank","The controller's explanation","A photocopy of an invoice"],answer:1,why:"External evidence obtained directly by the auditor ranks highest."},{q:"An attribute sample's upper deviation limit is 9%; tolerable is 6%. Conclusion?",options:["Rely on the control as planned","The control is not effective as planned — raise control risk and extend substantive work","Take a smaller sample","Ignore deviations under $21,000"],answer:1,why:"When the upper limit exceeds the tolerable rate, planned reliance is not supported."},{q:"A full-population test finds no exceptions. What can you say?",options:["The population contains no errors","No differences beyond the test's tolerance, within a population whose completeness you verified","The controls are effective","The documents are authentic"],answer:1,why:"Silence is bounded by tolerance and by the completeness of the data."}],task:{title:"Sample versus population",intro:"Use payments.csv and employees.csv.",steps:["Draw a random sample of 25 payments and test the attribute 'created by and approved by different people'. Compute your deviation rate.","Now test all 123 payments with a spreadsheet formula. How many deviations exist?","Explain why the two answers differ and which one you would put in the workpaper."],deliver:"Both results and a paragraph comparing them."},noesi:{coverage:"full",summary:"Noesi is built around evidence integrity and full-population testing. Each run is frozen, can be reperformed, and is reviewed by two other people.",does:["**Upload → map → approve → normalize.** The original file is stored unaltered in a vault, identified by its SHA-256 fingerprint. The column mapping is proposed by one person and approved by another. Row counts must reconcile: rows in = rows loaded + rows rejected.","**Refused fields** are recorded as audit facts: data the client did not provide.","**Reperform-on-read.** Every screen rebuilds the data from the original file and refuses to show data it cannot reproduce.","Each **run** freezes a manifest (procedure, engine version, a fingerprint of every input table, policies). A run is reviewed by the reviewer and approved by the partner, three different chairs."],where:["Workbench → Sources & Mappings","Workbench → Runs & Findings","Studio → Next step 'Run', 'Review', 'Approve'"],doesNot:["It does **no sampling**: no sample-size calculator, random selection, or attribute-test workpaper.","It does not inspect documents or judge authenticity. It compares records.","It accepts CSV for testing. Excel files are kept as evidence but must be exported to CSV before they can be normalized."],tryIt:"In Studio, follow the Next step card through Run, Review and Approve, switching chairs when it asks."}},{n:6,slug:"accounts-payable",title:"Accounts payable and the search for unrecorded liabilities",phase:"Fieldwork",question:"Is every liability at year end recorded — and only real ones?",minutes:40,objectives:["Tie the AP subledger to the general ledger","Perform a search for unrecorded liabilities","Test cutoff around year end","Turn exceptions into dispositions without overstating them"],sections:[{heading:"Start with the tie-out",blocks:[{p:"Before testing detail, prove the detail supports the balance: the **AP subledger** (the list of open invoices by vendor) should equal the **GL control account**. A difference means the detail you are about to test is not the balance on the statements."},{harborline:"Harborline's AP subledger totals **$2,731,569.42**; GL control account 2000 shows **$2,750,019.42** — a **$18,450.00** difference. It is below clearly trivial ($21,000). Is a year-end control-account difference *qualitatively* trivial? That is your judgment to argue and document."}]},{heading:"The search for unrecorded liabilities",blocks:[{p:"Because payables are usually **understated**, testing the recorded balance is not enough — you look for liabilities that **should** be there but are not. The classic procedure:"},{steps:["Take **cash disbursements after year end** (typically through fieldwork) above a threshold.","For each, find the invoice and receiving evidence and ask: **when was the liability incurred?**","If the goods or services were received **on or before year end**, the liability belonged in the year-end balance. Check that it was recorded.","Also review unmatched receiving reports, unprocessed invoices, and vendor statements."]},{harborline:"Harborline's payment **PAY-2026-0055** is dated **8 January 2027** — after year end — and cleared the bank on 12 January. It pays voucher **VCH-2026-9336**, which is **not in the voucher population at all**. Its $32,208.42 exceeds clearly trivial. A January payment for a voucher that the year-end records do not contain is exactly what this search exists to catch."}]},{heading:"Cutoff",blocks:[{p:"Transactions near year end must land in the right period. Examine receiving reports and invoices dated in the last days before and first days after year end, and check each against the period it was recorded in. A December receipt booked in January **understates** year-end liabilities."}]},{heading:"From exception to conclusion",blocks:[{p:"Each exception needs a documented judgment. The chain is always the same:"},{steps:["**What did the test observe?** (A payment citing a voucher that does not exist.)","**What could explain it?** (Export gap, keying error, duplicate, fabrication.)","**What did the investigation conclude?**","Only then: **is there a misstatement, and how much?**"]},{p:"Watch for one defect surfacing in two tests. A voucher citing a nonexistent PO fails both the PO-reference test and the three-way match. Put it on the summary of differences once."},{harborline:"In Harborline, three vouchers with phantom POs appear in both tests. Counting both would double up about $27,000 of exposure."}]},{heading:"When the client sends a corrected file",blocks:[{p:"Mid-audit, clients send corrected extracts. The file is not the problem: the problem is the work you already did on the old one. Every run, exception and judgment that rested on the old file must be revisited, and a finding that **disappears** after a 'correction' is not automatically resolved. Ask what the correction was, and why it came when it did."}]}],standards:[["AU-C 330","Substantive procedures responsive to completeness and cutoff risks"],["AU-C 500","Evaluating the completeness of populations used as evidence"],["AU-C 450","Accumulating and evaluating identified misstatements"]],check:[{q:"Why does the search for unrecorded liabilities look at payments made *after* year end?",options:["Because year-end payments are not important","Because a liability incurred before year end is often paid after it — the later payment reveals a liability that may be missing from the balance","To test the bank reconciliation","To test sales cutoff"],answer:1,why:"Completeness is tested by starting outside the recorded balance and working back to it."},{q:"Goods arrived 29 December; the invoice was recorded 6 January. At 31 December AP is…",options:["correct","understated","overstated","unaffected"],answer:1,why:"The liability existed at year end (goods received) but was not recorded until January."},{q:"One phantom-PO voucher fails both the PO-reference test and the three-way match. On the SAD it appears…",options:["twice — once per test","once, with the other finding cleared by reference","not at all","as two halves"],answer:1,why:"One root cause, one misstatement. Cross-reference the second finding to avoid double-counting."}],task:{title:"Search for unrecorded liabilities",intro:"Use payments.csv, vouchers.csv and ap_control_balance.csv.",steps:["List every payment dated after 31 December 2026 and every payment whose voucher is missing from vouchers.csv.","For each, state whether a year-end liability may be missing and what evidence you would request.","Reconcile the subledger to the GL, and write both sides of the argument on whether $18,450 is qualitatively trivial."],deliver:"A search-for-unrecorded-liabilities workpaper and a tie-out."},noesi:{coverage:"full",summary:"Accounts payable is Noesi's home ground: eleven procedures, recorded judgments, and a trail of what changed when the client's files changed.",does:["It runs the AP procedures: **payment→voucher** and **voucher→PO references**, **document chain**, **three-way match**, **segregation of duties**, **vendor twins**, **split payments**, **subledger–GL tie**, **bank clearing**, **GL posting** and **closed value flows**.","Every exception needs a **disposition** with a note: cleared, unadjusted, adjusted, waived, or follow-up. Above clearly trivial, the disposition is a **proposal until a second person concurs**.","**What Changed** compares a corrected client file with the one it replaced. It names the stale runs, shows which exceptions appear, disappear or move, and flags the judgments to revisit. It changes nothing by itself."],where:["Studio → Exceptions (judge in plain words)","Studio → What changed (cascade)","Workbench → Runs & Findings, What Changed"],doesNot:["It has **no subsequent-disbursements search procedure**. PAY-2026-0055 surfaces as a reference exception, but the unrecorded-liability judgment is yours.","It does not detect duplicate invoices. Harborline's Assignment 11 exists to show that silence.","It does not check cutoff on receipts, because the receipts file has no receiving-cutoff test."],tryIt:"Load case-studies/harborline-marine/revision/vouchers_revised.csv after judging a few exceptions, then open What changed."}},{n:7,slug:"revenue-and-receivables",title:"Revenue and accounts receivable",phase:"Fieldwork",question:"Did the sales happen, and will the receivables be collected?",minutes:30,objectives:["Apply the presumed fraud risk in revenue recognition","Design receivable confirmations and alternative procedures","Test revenue cutoff","Evaluate the allowance for doubtful accounts"],sections:[{heading:"Revenue is presumed risky",blocks:[{p:"AU-C 240 presumes a risk of material misstatement due to fraud in **revenue recognition**. You may rebut the presumption only with documented reasons. The typical fraud is **overstatement**: fictitious sales, early recognition, or channel stuffing. So for revenue and receivables, **occurrence and existence** lead, with **cutoff** close behind."},{harborline:"Harborline earns revenue from vessel sales, service work and winter storage across four locations. A lender watching revenue and a current-ratio covenant supplies the pressure. **Figures in this lesson are illustrative — the case data covers payables only.**"}]},{heading:"Confirmations",blocks:[{p:"Sending **external confirmations** to customers is the strongest existence evidence for receivables. Under AU-C 330, when receivables are material and you decide **not** to confirm them, you must document why. AU-C 505 governs how confirmations are sent and controlled."},{terms:[["Positive confirmation","The customer replies whether they agree or not. Stronger evidence. Non-replies need follow-up."],["Negative confirmation","The customer replies only if they disagree. Weaker evidence, suitable only in limited, low-risk conditions."],["Control of the process","You select the accounts, mail or send them yourself, and replies come directly to you, never through the client."]]},{p:"For non-replies, perform **alternative procedures**: examine **cash received after year end** for that invoice, or shipping documents and the customer's order."}]},{heading:"Cutoff and valuation",blocks:[{list:["**Revenue cutoff**: examine shipments or service completions just before and after year end and check the period of the sale. Sales pulled into December overstate revenue and receivables.","**Valuation**: review the **aging** of receivables, subsequent collections, and management's **allowance for doubtful accounts**. An estimate needs evidence about its method, data and assumptions."]},{p:"Illustration: a $180,000 boat sale recorded 30 December, with the vessel delivered 4 January. If control passes on delivery, that revenue belongs in January. Against $420,000 materiality it is significant, and qualitatively sensitive because of the covenant."}]}],standards:[["AU-C 240","Presumed fraud risk in revenue recognition"],["AU-C 330","Documenting a decision not to confirm material receivables"],["AU-C 505","External confirmations"],["AU-C 540","Accounting estimates, e.g. the allowance for doubtful accounts"]],check:[{q:"Which assertion does an AR confirmation mainly address?",options:["Completeness","Existence","Valuation","Presentation"],answer:1,why:"A customer confirming a balance evidences that the receivable exists. It says little about collectibility."},{q:"A positive confirmation is not returned. Next step?",options:["Treat it as confirmed","Perform alternative procedures: subsequent cash receipts or shipping documents","Remove the balance","Ask the client to call the customer"],answer:1,why:"A non-reply is not evidence. Alternative procedures supply it."},{q:"Revenue recognition fraud risk under AU-C 240 is…",options:["only considered for public companies","presumed, and rebutting it requires documented reasons","never presumed","the auditor's to ignore if controls are strong"],answer:1,why:"It is a rebuttable presumption, and the documentation requirement is explicit."}],task:{title:"Design the confirmation plan",intro:"Illustrative: Harborline has 240 customer balances totalling $3.1m; the ten largest total $1.9m.",steps:["Decide which balances to confirm and whether positive or negative, and justify it.","Write the alternative procedures for a non-reply.","List three cutoff tests for vessel sales around 31 December."],deliver:"A one-page receivables plan."},noesi:{coverage:"none",summary:"Noesi does not audit revenue or receivables yet. Here is what it can and cannot hold.",does:["The **evidence vault** keeps PDFs, CSVs and Excel files unaltered with a SHA-256 fingerprint, for example confirmation replies received as PDFs.","The engagement's review, disposition and lock disciplines apply to the whole file."],where:["Workbench → Sources & Mappings (upload documents)"],doesNot:["It has **no receivables or revenue procedures**, no confirmation tracking, and no aging or allowance tools. Coverage will not invent them, and AP engines cannot be relabeled as AR tests.","Images (photos or scans saved as images) are not accepted file types."]}},{n:8,slug:"cash",title:"Cash",phase:"Fieldwork",question:"Does the cash on the balance sheet really exist, and is it cut off correctly?",minutes:25,objectives:["Audit a bank reconciliation","Explain outstanding checks and deposits in transit","Test cash cutoff with subsequent bank activity","Know what SAS 150 changes for cash confirmations"],sections:[{heading:"The bank reconciliation",blocks:[{p:"The client's reconciliation explains the difference between the **bank's balance** and the **book balance** at year end:"},{table:{head:["Bank balance","± reconciling items","= Book balance"],rows:[["per bank statement","− outstanding checks (written, not yet cleared)",""],["","+ deposits in transit (recorded, not yet credited)",""],["","± bank errors","per general ledger"]]}},{p:"You test it: agree the bank balance to **independent evidence** (a confirmation or the next statement obtained directly), agree the book balance to the GL, and **trace reconciling items** to the bank activity in the following weeks. Outstanding checks should clear soon after year end; deposits in transit should appear within a few days."}]},{heading:"Cutoff and kiting",blocks:[{p:"Checks written at year end but held back (not mailed) make liabilities look paid and cash look lower. Checks recorded in January but dated December do the opposite. **Kiting** moves money between accounts at year end so the same cash appears in both. A **bank transfer schedule** around year end exposes it."},{harborline:"Harborline's **PAY-2026-0028** ($16,830.55) is dated **31 December 2026** and cleared the bank on **2 January 2027**: a genuine outstanding check at year end. Tracing it to January clearing is the test. A check that never clears would be the question."}]},{heading:"Confirmations and SAS 150",blocks:[{p:"Cash is often confirmed directly with the bank. The AICPA's **SAS No. 150, External Confirmations** (July 2026) adds a **requirement to confirm cash and cash equivalents held by third parties** unless certain conditions exist. It is effective for audits of periods ending on or after **December 15, 2028**, with early adoption permitted. Harborline's 2026 audit predates it, but the direction is clear."}]}],standards:[["AU-C 505","External confirmations"],["SAS 150","External Confirmations: cash confirmation requirement, effective for periods ending on or after 12/15/2028"],["AU-C 330 / 500","Substantive procedures and evidence for cash"]],check:[{q:"An outstanding check at year end is…",options:["recorded by the bank but not the books","recorded in the books but not yet cleared by the bank","a deposit in transit","a bank error"],answer:1,why:"The company wrote and recorded it. The bank has not paid it yet."},{q:"The best evidence that a year-end outstanding check was real is…",options:["the controller's list","its clearing on the bank statement shortly after year end, obtained directly","the check stub","the GL entry"],answer:1,why:"Subsequent bank clearing, from a source you obtained, is independent evidence."},{q:"SAS 150 applies to audits of periods ending on or after…",options:["December 15, 2023","December 15, 2025","December 15, 2028","It is already mandatory for 2026"],answer:2,why:"SAS 150 is effective for periods ending on or after December 15, 2028, with early adoption permitted."}],task:{title:"Cash cutoff from the bank feed",intro:"Use payments.csv and bank.csv.",steps:["List every payment dated in the last ten days of 2026 and find its bank clearing date.","Classify each: cleared before year end, or an outstanding check at year end.","Find any payment that never clears in bank.csv and say what you would do."],deliver:"An outstanding-check listing with clearing dates."},noesi:{coverage:"partial",summary:"Noesi tests the payments side of cash against an independent bank feed. It is not a bank-reconciliation tool.",does:["**Bank clearing** (`cash.bank_clearing`) checks that every recorded payment appears in the bank feed at the same amount, within a **2% tolerance**.","**GL posting** (`gl.payment_posting`) checks that each payment posted to the GL at the right amount and in the right period. Period mismatches are cutoff exceptions."],where:["Studio → Overview (the 'Cleared bank' and 'Posted to GL' circles)","Workbench → Runs & Findings"],doesNot:["It does not audit the cash balance itself: no bank-reconciliation workpaper, deposits in transit, receipts side, or bank confirmation tracking.","Its 2% tolerance hides small differences. In Harborline, one 0.9% difference is correctly silent, so reconcile by hand to find it."]}},{n:9,slug:"inventory",title:"Inventory",phase:"Fieldwork",question:"Is the inventory there, owned, and worth what it is carried at?",minutes:25,objectives:["Plan and attend a physical inventory count","Perform test counts in both directions","Test inventory cutoff, pricing and obsolescence"],sections:[{heading:"Attend the count",blocks:[{p:"When inventory is material, AU-C 501 requires you to **attend the physical count** unless impracticable. If you cannot, you must perform alternative procedures. If those fail, you must modify the opinion. You observe the client's count procedures and make **test counts**."},{terms:[["Floor to sheet","Count items on the floor and trace them to the count records. This tests **completeness**."],["Sheet to floor","Take items from the count records and find them on the floor. This tests **existence**."]]},{harborline:"Harborline carries vessels for sale and a parts warehouse in Norfolk. **Figures here are illustrative — the case data covers payables only.** A boat on consignment from a manufacturer sits on the lot but may not be Harborline's: **rights and obligations** matter as much as existence."}]},{heading:"Cutoff, pricing and obsolescence",blocks:[{list:["**Cutoff**: record the last receiving and shipping document numbers at the count. Goods received before the count must be in both inventory and payables. This is where inventory meets Lesson 6.","**Pricing**: test the cost of counted items against vendor invoices and the costing method.","**Valuation**: identify slow-moving or damaged items and test whether inventory is written down to the lower of cost and net realizable value."]},{watch:"Harborline's warehouse switched to scanner receiving mid-year, and the controller expects some receipts never reached the system. That affects inventory completeness and payables completeness at the same time."}]}],standards:[["AU-C 501","Specific considerations for inventory: attendance at physical counting"],["AU-C 540","Estimates: net realizable value, obsolescence reserves"]],check:[{q:"Tracing items from the floor to the count sheets tests…",options:["existence","completeness","valuation","presentation"],answer:1,why:"Starting from the physical items checks that everything present was recorded."},{q:"Inventory is material and you cannot attend the count. You must…",options:["rely on management's count","perform alternative procedures; if they are insufficient, modify the opinion","exclude inventory from the audit","issue a clean opinion with a note"],answer:1,why:"AU-C 501 requires attendance unless impracticable, then alternatives, then a modified opinion."},{q:"A consigned vessel on Harborline's lot threatens which assertion if it is counted?",options:["Cutoff","Rights and obligations","Classification","Accuracy"],answer:1,why:"It exists, but Harborline does not own it."}],task:{title:"Plan the count",intro:"Illustrative: 38 vessels on four lots; 6,200 part SKUs in Norfolk.",steps:["Write the count instructions you would review and the observations you would make.","Design test counts in both directions, with sample sizes.","Link the receiving-process change to both inventory and payables cutoff."],deliver:"A count-attendance plan."},noesi:{coverage:"none",summary:"Noesi has no inventory procedures. Count attendance is physical work that no software performs.",does:["The vault can keep count sheets and price lists as PDF, CSV or Excel files, unaltered and fingerprinted.","The **three-way match** touches inventory indirectly: it flags invoices without receipts, which is also an inventory-completeness signal."],where:["Workbench → Sources & Mappings (store documents)"],doesNot:["It has no count, test-count, cutoff, pricing or obsolescence procedures. Coverage will never report inventory as tested."]}}],rp=[{n:1,slug:"acceptance",title:"Client acceptance and the terms of the engagement",phase:"Planning",question:"Should we do this audit at all — and on what terms?",minutes:20,objectives:["Explain why a firm decides whether to accept or continue a client before any audit work","List what acceptance considers: integrity, independence, competence, and risk","Describe what the engagement letter must establish","Know what changes when a firm replaces another auditor"],sections:[{heading:"Why the audit starts with a decision, not a test",blocks:[{p:"An audit is a firm putting its name on someone else's numbers. Before any testing, the firm decides whether it **can** and **should** take that risk. A bad client — one whose management lacks integrity, or whose affairs the firm cannot competently audit — is a risk no amount of fieldwork repairs."},{p:"U.S. firms now run this decision inside a **quality management system**. SQMS No. 1 (firm level) and SAS No. 146 (the engagement partner's responsibilities, in AU-C 220) apply to engagements for periods beginning on or after December 15, 2025. Acceptance and continuance of clients is one of the areas every firm must set quality objectives for."}]},{heading:"What acceptance and continuance weigh",blocks:[{terms:[["Integrity of management","Is there reason to believe management would mislead the auditor, override controls, or pressure the firm? Prior disputes, regulatory trouble and sudden auditor changes are signals."],["Independence and ethics","Does anyone on the team, or the firm, hold a financial interest, a family tie, or a non-audit service that impairs independence in fact or appearance?"],["Competence and capacity","Does the firm have people who know the industry and the time to staff the job before the deadline?"],["Engagement risk","Who relies on the statements (lenders, investors)? How exposed is the firm if the audit fails?"]]},{p:"For an existing client this is repeated every year as **continuance**. It is not a formality: circumstances change, and so does the risk."}]},{heading:"Changing auditors",blocks:[{p:"If another firm audited last year, the new (successor) auditor makes inquiries of the predecessor — with the client's permission — about management integrity, disagreements, and the reasons for the change. AU-C 510 then requires evidence that the **opening balances** carry no material misstatement into the current year."},{watch:"A client that refuses permission to talk to the predecessor has told you something important. Treat it as a reason to decline, not a paperwork gap."}]},{heading:"The engagement letter",blocks:[{p:"AU-C 210 requires agreement on the **terms of the engagement**, normally in an engagement letter, before work begins. It establishes the preconditions for an audit:"},{list:["the objective and scope of the audit and the financial reporting framework (for example U.S. GAAP);","**management's responsibilities** — for the financial statements, for internal control, and for giving the auditor access to all information and people;","the auditor's responsibilities and the inherent limitations of an audit (reasonable, not absolute, assurance);","the expected form of the report, and practical matters such as timing and fees."]},{p:"If management will not accept i
