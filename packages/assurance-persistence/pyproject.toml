[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-persistence"
version = "0.1.0"
description = "Transactional persistence adapters: SQLite control DB, migrations, event journal, outbox."
requires-python = ">=3.12"
dependencies = [
    "assurance-domain",
]

[tool.setuptools.packages.find]
where = ["src"]
