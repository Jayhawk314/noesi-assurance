[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procedures-cycles"
version = "0.1.0"
description = "Cycle audit methodology beyond AP: planning, controls sampling, receivables, cash, inventory, completion."
requires-python = ">=3.12"
dependencies = [
    "assurance-domain",
    "procedures-ap",
]

[tool.setuptools.packages.find]
where = ["src"]
