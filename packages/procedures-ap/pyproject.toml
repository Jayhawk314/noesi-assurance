[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procedures-ap"
version = "0.1.0"
description = "Controlled AP audit methodology: procedure contracts and deterministic engines."
requires-python = ">=3.12"
dependencies = [
    "assurance-domain",
]

[tool.setuptools.packages.find]
where = ["src"]
