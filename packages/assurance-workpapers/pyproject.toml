[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-workpapers"
version = "0.1.0"
description = "Evidence packet and workpaper builder: exports from frozen signed snapshots, offline-verifiable with the material carried inside the packet."
requires-python = ">=3.12"
dependencies = [
    "assurance-domain",
    "assurance-artifacts",
]

[tool.setuptools.packages.find]
where = ["src"]
