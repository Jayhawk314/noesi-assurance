[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-artifacts"
version = "0.1.0"
description = "Immutable evidence vault: streamed quarantine intake, content-addressed write-once storage, verified reads, explicit retention."
requires-python = ">=3.12"
dependencies = [
    "assurance-domain",
    "assurance-persistence",
]

[tool.setuptools.packages.find]
where = ["src"]
